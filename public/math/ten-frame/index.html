<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>十格图：凑十法</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext" id="q"></div>
<svg id="s" viewBox="0 0 400 160" style="width:100%;max-width:560px"></svg>
<div class="sl"><b id="la"></b><input type="range" min="2" max="9" value="9" id="a"></div><div class="sl"><b id="lb"></b><input type="range" min="2" max="9" value="4" id="b"></div>
<div class="cc"><button class="btn" id="mv">拆一个补凑十</button><button class="btn ghost" id="rs">重来</button></div>
<div id="out" style="font-size:20px;line-height:1.9;min-height:60px"></div></div>
<div class="panel"><b>凑十法：</b>9 + 4，先给 9 补 1 凑成 10，从 4 里拿走 1（4 拆成 1 和 3），10 + 3 = 13。凑成整十，再数就简单了。</div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('十格图：凑十法');
var $=function(i){return document.getElementById(i)};

var moved=0;
function frame(x,n,col,big){var s='',i;for(i=0;i<10;i++){var cx=x+(i%5)*34,cy=24+Math.floor(i/5)*34;s+='<rect x="'+cx+'" y="'+cy+'" width="32" height="32" fill="#fff" stroke="#334155" stroke-width="2"/>';if(i<n)s+='<circle cx="'+(cx+16)+'" cy="'+(cy+16)+'" r="12" fill="'+col+'"/>'}return s}
function draw(){var a=+$('a').value,b=+$('b').value,step=Math.min(10-a,b);$('la').textContent='第一个数 '+a;$('lb').textContent='第二个数 '+b;
  $('q').innerHTML=a+' + '+b+' = ？';var A=a+moved,B=b-moved,s=frame(10,A,'#6366f1')+frame(210,B,'#f59e0b');
  if(moved>0)s+='<text x="195" y="75" font-size="22" text-anchor="middle">+</text>';
  s+='<text x="95" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">'+A+'</text><text x="295" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#d97706">'+B+'</text>';$('s').innerHTML=s;
  if(moved===0)$('out').innerHTML=a+' 再添 '+step+' 个就凑成 10。点“拆一个补凑十”。';
  else $('out').innerHTML=b+' 拆成 '+moved+' 和 '+B+'<br>'+a+' + '+moved+' = 10，10 + '+B+' = <b style="color:#4f46e5">'+(a+b)+'</b>';
  if(moved===step&&moved>0)Hub.star('ten-frame',2)}
$('mv').onclick=function(){var a=+$('a').value,b=+$('b').value;if(moved<Math.min(10-a,b)){moved++;draw()}};
$('rs').onclick=function(){moved=0;draw()};
['a','b'].forEach(function(k){$(k).addEventListener('input',function(){moved=0;draw()})});
draw();
</script></body></html>
