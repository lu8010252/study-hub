<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>认识长方体：面、棱、顶点</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="cc"><button class="btn" data-m="f">面（6 个）</button><button class="btn ghost" data-m="e">棱（12 条）</button><button class="btn ghost" data-m="v">顶点（8 个）</button></div>
<svg id="s" viewBox="-170 -140 340 260" style="width:100%;max-width:520px;touch-action:none"></svg>
<div class="mut">拖动图形可以转着看（虚线是看不见的棱）</div>
<div id="out" style="font-size:19px;line-height:1.9;margin:6px 0"></div>
<div class="sl"><b id="l1"></b><input type="range" min="2" max="9" value="6" data-k="a"></div><div class="sl"><b id="l2"></b><input type="range" min="2" max="9" value="4" data-k="b"></div><div class="sl"><b id="l3"></b><input type="range" min="1" max="9" value="3" data-k="c"></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('认识长方体：面、棱、顶点');
var $=function(i){return document.getElementById(i)};

var mode='f',ang=-0.6,ax=0.55,D={a:6,b:4,c:3},drag=null,CL=['#6366f1','#f59e0b','#22a06b'];
function view(p){var c=Math.cos(ang),s=Math.sin(ang),x=p[0]*c-p[1]*s,y=p[0]*s+p[1]*c,z=p[2];return [x,-(y*Math.sin(ax)+z*Math.cos(ax)),-y*Math.cos(ax)+z*Math.sin(ax)]}
function draw(){var a=D.a,b=D.b,c=D.c,K=22,V=[];for(var i=0;i<8;i++)V.push([(i&1?a:0)-a/2,(i&2?b:0)-b/2,(i&4?c:0)-c/2]);
  var F=[[0,1,3,2,'下',2,[0,0,-1]],[4,5,7,6,'上',2,[0,0,1]],[0,1,5,4,'前',1,[0,-1,0]],[2,3,7,6,'后',1,[0,1,0]],[0,2,6,4,'左',0,[-1,0,0]],[1,3,7,5,'右',0,[1,0,0]]];
  var cam=[0,-Math.cos(ax),Math.sin(ax)];var cr=Math.cos(ang),sr=Math.sin(ang);
  /* 相机方向转回物体坐标 */var cx=cam[0]*cr+cam[1]*sr,cy=-cam[0]*sr+cam[1]*cr,cz=cam[2];
  var front=F.map(function(f){return f[6][0]*cx+f[6][1]*cy+f[6][2]*cz>0});
  var items=F.map(function(f,i){var pts=f.slice(0,4).map(function(k){return view(V[k])});return {i:i,pts:pts,d:pts.reduce(function(s,p){return s+p[2]/4},0)}}).sort(function(p,q){return p.d-q.d}),s='';
  items.forEach(function(it){if(!front[it.i])return;var f=F[it.i];s+='<polygon points="'+it.pts.map(function(p){return (p[0]*K).toFixed(1)+','+(p[1]*K).toFixed(1)}).join(' ')+'" fill="'+(mode==='f'?CL[f[5]]:'#e0e7ff')+'" fill-opacity="'+(mode==='f'?.55:.35)+'" stroke="none"/>';
    if(mode==='f'){var cxx=0,cyy=0;it.pts.forEach(function(p){cxx+=p[0]/4;cyy+=p[1]/4});s+='<text x="'+(cxx*K)+'" y="'+(cyy*K+5)+'" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">'+f[4]+'</text>'}});
  /* 棱：12 条 */var E=[],dirs=[[0,1,0],[2,3,0],[4,5,0],[6,7,0],[0,2,1],[1,3,1],[4,6,1],[5,7,1],[0,4,2],[1,5,2],[2,6,2],[3,7,2]];
  dirs.forEach(function(e){var adj=F.map(function(f,i){return f.slice(0,4).indexOf(e[0])>=0&&f.slice(0,4).indexOf(e[1])>=0?i:-1}).filter(function(i){return i>=0}),hid=adj.every(function(i){return !front[i]}),p1=view(V[e[0]]),p2=view(V[e[1]]);
    s+='<line x1="'+(p1[0]*K)+'" y1="'+(p1[1]*K)+'" x2="'+(p2[0]*K)+'" y2="'+(p2[1]*K)+'" stroke="'+(mode==='e'?CL[e[2]]:'#334155')+'" stroke-width="'+(mode==='e'?5:2.5)+'" '+(hid?'stroke-dasharray="5 4" opacity=".6"':'')+' stroke-linecap="round"/>'});
  if(mode==='v')V.forEach(function(v,i){var p=view(v);s+='<circle cx="'+(p[0]*K)+'" cy="'+(p[1]*K)+'" r="10" fill="#e5484d" stroke="#fff" stroke-width="2"/><text x="'+(p[0]*K)+'" y="'+(p[1]*K+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">'+(i+1)+'</text>'});
  $('s').innerHTML=s;$('l1').textContent='长 '+a;$('l2').textContent='宽 '+b;$('l3').textContent='高 '+c;
  $('out').innerHTML=mode==='f'?'有 <b>6</b> 个面，<b>相对的面</b>形状大小完全相同：<br>上下面 '+a+'×'+b+'，前后面 '+a+'×'+c+'，左右面 '+b+'×'+c:mode==='e'?'有 <b>12</b> 条棱，分成 3 组，每组 4 条<b>同样长</b>：<br><span style="color:#6366f1">长 '+a+' 的 4 条</span>　<span style="color:#f59e0b">宽 '+b+' 的 4 条</span>　<span style="color:#22a06b">高 '+c+' 的 4 条</span><br>棱长总和 = ('+a+' + '+b+' + '+c+') × 4 = <b>'+(a+b+c)*4+'</b>':'有 <b>8</b> 个顶点，每个顶点连着 <b>3</b> 条棱（长、宽、高各一条）';
  Hub.star('cuboid-parts',1)}
$('s').addEventListener('pointerdown',function(e){drag=[e.clientX,e.clientY,ang,ax];$('s').setPointerCapture(e.pointerId)});$('s').addEventListener('pointermove',function(e){if(!drag)return;ang=drag[2]+(e.clientX-drag[0])*.01;ax=Math.max(.1,Math.min(1.45,drag[3]+(e.clientY-drag[1])*.01));draw()});
['pointerup','pointercancel'].forEach(function(k){$('s').addEventListener(k,function(){drag=null})});
document.addEventListener('input',function(e){var k=e.target.dataset.k;if(k){D[k]=+e.target.value;draw()}});
document.addEventListener('click',function(e){var m=e.target.dataset.m;if(m){mode=m;[].forEach.call(document.querySelectorAll('[data-m]'),function(x){x.classList.toggle('ghost',x.dataset.m!==m)});draw()}});draw();
</script></body></html>
