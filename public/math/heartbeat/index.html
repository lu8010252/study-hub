<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>心跳计时器</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="cc"><button class="btn" data-m="t">测一测我的心跳</button><button class="btn ghost" data-m="s">看看不同心跳速度</button></div>
<div id="A"><div class="qtext" id="tip">把手指放在手腕上，感觉心跳。点“开始”后 15 秒内，每感觉到一次心跳就点一下大红心</div>
<div id="heart" style="font-size:120px;line-height:1.1;cursor:pointer;user-select:none;transition:transform .08s">❤️</div>
<div class="big2" id="cd">15 秒</div><div class="big2" id="tp">0 下</div>
<div class="cc"><button class="btn" id="go">▶ 开始</button></div><div id="res" style="font-size:20px;line-height:1.8"></div></div>
<div id="B" style="display:none"><div style="font-size:120px;line-height:1.1" id="h2">❤️</div>
<div class="sl"><b id="lb"></b><input type="range" min="40" max="200" value="75" id="bpm"></div><div id="ex" style="font-size:19px;line-height:1.8"></div></div></div>
<div class="panel"><b>知识：</b>1 分 = 60 秒。测 15 秒的心跳次数，再乘 4，就是 1 分钟的心跳次数。小学生安静时，心跳每分钟大约 80~100 次；跑步以后会变快。</div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('心跳计时器');
var $=function(i){return document.getElementById(i)};

var mode='t',run=false,cnt=0,left=15,tm=null,beat=null;
function pulse(el){el.style.transform='scale(1.25)';setTimeout(function(){el.style.transform='scale(1)'},90)}
$('heart').addEventListener('pointerdown',function(){if(!run)return;cnt++;$('tp').textContent=cnt+' 下';pulse($('heart'));Hub.beep(true)});
$('go').onclick=function(){cnt=0;left=15;run=true;$('tp').textContent='0 下';$('res').textContent='';$('cd').textContent=left+' 秒';clearInterval(tm);tm=setInterval(function(){left--;$('cd').textContent=left+' 秒';if(left<=0){clearInterval(tm);run=false;var bpm=cnt*4;$('res').innerHTML='15 秒心跳 '+cnt+' 下 → 1 分钟 = '+cnt+' × 4 = <b style="color:#e5484d">'+bpm+'</b> 下<br><span class="mut">'+(bpm<60?'比较慢，是不是数少了？':bpm<=110?'在正常范围里':'比较快，是不是刚运动完？')+'</span>';Hub.star('heartbeat',3)}},1000)};
function setBeat(){clearInterval(beat);var b=+$('bpm').value;$('lb').textContent='每分钟 '+b+' 下';$('ex').innerHTML='每分钟 '+b+' 下，平均每下 60 ÷ '+b+' ≈ <b>'+(60/b).toFixed(2)+'</b> 秒<br>15 秒大约跳 '+(b/4).toFixed(1)+' 下';if(mode==='s'){beat=setInterval(function(){pulse($('h2'))},60000/b)}}
$('bpm').addEventListener('input',function(){setBeat();Hub.star('heartbeat',1)});
document.addEventListener('click',function(e){var m=e.target.dataset.m;if(m){mode=m;[].forEach.call(document.querySelectorAll('[data-m]'),function(x){x.classList.toggle('ghost',x.dataset.m!==m)});$('A').style.display=m==='t'?'':'none';$('B').style.display=m==='s'?'':'none';if(m==='s')setBeat();else clearInterval(beat)}});
</script></body></html>
