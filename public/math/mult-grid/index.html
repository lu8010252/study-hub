<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>九九乘法表</title><link rel="stylesheet" href="/css/hub.css">
<style>table{border-collapse:collapse;margin:0 auto}td,th{width:min(9.5vw,52px);height:min(9.5vw,52px);text-align:center;border:1px solid var(--line);font-weight:700;font-size:clamp(11px,3vw,18px);cursor:pointer;user-select:none;touch-action:manipulation}
th{background:var(--bg);color:var(--p1)}td.r{background:#e0e7ff}td.c{background:#e0e7ff}td.s{background:var(--p1);color:#fff}td.f{background:var(--ok);color:#fff}td.w{background:var(--bad);color:#fff}td.h{color:transparent}
.dots{display:inline-grid;gap:4px;margin:6px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--p1)}</style></head>
<body><div class="page">
<div class="panel" style="text-align:center"><div class="row" style="justify-content:center"><button class="btn" id="m1">看一看</button><button class="btn ghost" id="m2">找一找（游戏）</button></div>
 <div id="info" style="min-height:90px;margin:8px 0"></div><table id="t"></table></div></div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('九九乘法表');
var $=function(i){return document.getElementById(i)};
var CN='零一二三四五六七八九',mode=1,goal=null,solved=0,sel=null;
function kj(a,b){var x=Math.min(a,b),y=Math.max(a,b),p=a*b,t;if(p<10)t=CN[x]+CN[y]+'得'+CN[p];else if(p===10)t=CN[x]+CN[y]+'一十';else if(p<20)t=CN[x]+CN[y]+'十'+CN[p-10];else t=CN[x]+CN[y]+CN[Math.floor(p/10)]+'十'+(p%10?CN[p%10]:'');return t}
function draw(){
  var h='<tr><th>×</th>',i,j;for(j=1;j<=9;j++)h+='<th>'+j+'</th>';h+='</tr>';
  for(i=1;i<=9;i++){h+='<tr><th>'+i+'</th>';for(j=1;j<=9;j++){var c='';if(mode===1&&sel){if(i===sel[0]&&j===sel[1])c='s';else if(i===sel[0]||j===sel[1])c='r'}
    if(mode===2&&goal&&goal.res&&i===goal.a&&j===goal.b)c='f';h+='<td class="'+c+'" data-a="'+i+'" data-b="'+j+'">'+(mode===2?'':i*j)+'</td>'}h+='</tr>'}
  $('t').innerHTML=h;
}
function dots(a,b){var s='<span class="dots" style="grid-template-columns:repeat('+b+',14px)">';for(var i=0;i<a*b;i++)s+='<i></i>';return s+'</span>'}
$('t').onclick=function(e){var c=e.target.closest('td');if(!c)return;var a=+c.dataset.a,b=+c.dataset.b;
  if(mode===1){sel=[a,b];$('info').innerHTML='<b style="font-size:24px">'+a+' × '+b+' = '+a*b+'</b>　口诀：'+kj(a,b)+'<br>'+dots(a,b)+'<br><small>'+a+' 行，每行 '+b+' 个</small>';draw()}
  else if(goal&&!goal.res){var ok=(a*b===goal.a*goal.b);if(ok){goal.res=1;solved++;c.className='f';$('info').innerHTML='<b style="color:var(--ok)">✔ 找对了！'+goal.a+' × '+goal.b+' = '+goal.a*goal.b+'（'+kj(goal.a,goal.b)+'）</b>　已完成 '+solved+' 题';Hub.beep(true);Hub.star('mult-grid',solved>=5?3:solved>=3?2:1);setTimeout(next,1300)}else{c.className='w';Hub.beep(false);setTimeout(function(){c.className=''},500)}}};
function next(){goal={a:Hub.rnd(2,9),b:Hub.rnd(2,9)};$('info').innerHTML='<b style="font-size:24px">找出 '+goal.a+' × '+goal.b+' 的积（点那一格；表里的数先藏起来了，答案相同的格子都算对）</b>';draw()}
function set(m){mode=m;$('m1').className='btn'+(m===1?'':' ghost');$('m2').className='btn'+(m===2?'':' ghost');sel=null;if(m===2){solved=0;next()}else{$('info').innerHTML='<span style="color:var(--sub)">点任意一格，看口诀和点子图</span>';draw()}}
$('m1').onclick=function(){set(1)};$('m2').onclick=function(){set(2)};
set(1);
</script></body></html>
