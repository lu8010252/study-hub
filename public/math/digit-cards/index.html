<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>数字卡片组数</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext" id="task"></div>
<div style="color:var(--sub)">点下面的数字卡片，放进数位表（点已放好的卡片可以拿回来）</div>
<div style="overflow-x:auto"><div id="slots" style="display:flex;justify-content:center;gap:4px;margin:10px 0;min-width:480px"></div></div>
<div id="cards" class="cc"></div><div class="big2" id="rd" style="min-height:40px"></div><div class="msg" id="m"></div>
<div class="cc"><button class="btn" id="chk">检查</button><button class="btn ghost" id="nx">换一题</button></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('数字卡片组数');
var $=function(i){return document.getElementById(i)};

var N=['零','一','二','三','四','五','六','七','八','九'],NM=['','十','百','千'];
function g4(n){var d=[Math.floor(n/1000),Math.floor(n/100)%10,Math.floor(n/10)%10,n%10],s='',z=false,i;for(i=0;i<4;i++){var x=d[i],u=NM[3-i];if(x===0){if(s)z=true}else{if(z){s+='零';z=false}s+=N[x]+u}}return s}
function cn(str){var n=str.replace(/^0+/,'');if(!n)return '零';var gs=[],i=n.length;while(i>0){gs.unshift(+n.slice(Math.max(0,i-4),i));i-=4}var U=['','万','亿'],out='',pend=false;gs.forEach(function(g,k){var idx=gs.length-1-k;if(g===0){pend=true;return}if(out&&(pend||g<1000))out+='零';var t=g4(g);if(!out&&t.indexOf('一十')===0)t=t.slice(1);out+=t+U[idx];pend=false});return out}
var cards,slot,task,sc=0,L=8,HEAD=['千万','百万','十万','万','千','百','十','个'];
function zeros(s){return (cn(s).match(/零/g)||[]).length}
function feasible(kind){var d=cards.slice(),res=false,used=[];(function rec(cur,rest){if(res)return;if(!rest.length){if(cur[0]==='0')return;var z=zeros(cur.join(''));if((kind==='one0'&&z===1)||(kind==='zero0'&&z===0))res=true;return}
  var seen={};rest.forEach(function(x,i){if(seen[x])return;seen[x]=1;var r=rest.slice();r.splice(i,1);rec(cur.concat([x]),r)})})([],d);return res}
function gen(){var kinds=['max','min','one0','zero0'],kind=kinds[Hub.rnd(0,3)],tries=0;
  do{cards=[];var z=Hub.rnd(2,3),i;for(i=0;i<L-z;i++)cards.push(String(Hub.rnd(1,9)));for(i=0;i<z;i++)cards.push('0');cards.sort(function(){return Math.random()-.5});tries++}while((kind==='one0'||kind==='zero0')&&!feasible(kind)&&tries<60);
  if((kind==='one0'||kind==='zero0')&&!feasible(kind))kind='max';
  task=kind;slot=[];$('task').innerHTML={max:'用这 8 张卡片组成<b>最大</b>的八位数',min:'用这 8 张卡片组成<b>最小</b>的八位数（最高位不能是 0）',one0:'组成一个八位数，使它<b>只读出一个“零”</b>',zero0:'组成一个八位数，使它<b>一个“零”也不读</b>'}[kind];$('m').textContent='';render()}
function render(){var used={};slot.forEach(function(i){used[i]=1});
  $('slots').innerHTML=Array.apply(null,Array(L)).map(function(_,i){var has=i<slot.length;return '<div data-s="'+i+'" style="flex:1;max-width:60px;text-align:center"><div style="font-size:12px;color:#64748b">'+HEAD[i]+'</div><div style="height:54px;border:2px solid '+(has?'#6366f1':'#cbd5e1')+';border-radius:10px;font-size:30px;font-weight:800;line-height:50px;background:'+(has?'#eef2ff':'#fff')+'">'+(has?cards[slot[i]]:'')+'</div></div>'+(i===3?'<div style="width:6px;background:#e2e8f0;border-radius:3px"></div>':'')}).join('');
  $('cards').innerHTML=cards.map(function(c,i){return used[i]?'':'<button class="btn" data-c="'+i+'" style="min-width:52px;font-size:26px">'+c+'</button>'}).join('');
  $('rd').textContent=slot.length===L?'读作：'+cn(slot.map(function(i){return cards[i]}).join('')):''}
document.addEventListener('click',function(e){var d=e.target.closest('[data-c],[data-s]');if(!d)return;if(d.dataset.c!==undefined&&slot.length<L){slot.push(+d.dataset.c);render()}else if(d.dataset.s!==undefined){var i=+d.dataset.s;if(i<slot.length){slot.splice(i,1);render()}}});
$('chk').onclick=function(){if(slot.length<L){$('m').className='msg bad';$('m').textContent='还没摆完，8 个数位都要放上卡片';return}
  var s=slot.map(function(i){return cards[i]}).join(''),c=cards.slice().sort(),ok=false,why='';
  if(task==='max'){ok=s===c.slice().reverse().join('');why='最大的数：数位高的位置放大数'}
  else if(task==='min'){var m=c.slice(),j=0;while(m[j]==='0')j++;var f=m.splice(j,1)[0];ok=s===f+m.join('');why='最小的数：最高位放最小的非 0 数，其余从小到大'}
  else{if(s[0]==='0'){why='最高位不能是 0'}else{var z=zeros(s);ok=task==='one0'?z===1:z===0;why='你摆的数读作 '+cn(s)+'，读出了 '+z+' 个零。想想：每级末尾的 0 不读，其它连续的 0 只读一个'}}
  $('m').className='msg '+(ok?'ok':'bad');$('m').textContent=ok?'✔ 正确！读作：'+cn(s):'✘ '+why;Hub.beep(ok);if(ok){sc++;Hub.star('digit-cards',sc>=4?3:sc>=2?2:1)}};
$('nx').onclick=gen;gen();
</script></body></html>
