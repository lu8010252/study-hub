<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>无限切割</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext">每次把剩下的一半涂色，一直切下去……</div>
<svg id="s" viewBox="0 0 320 240" style="width:100%;max-width:480px;background:#fff;border-radius:10px"></svg>
<div class="big2" id="eq"></div><div class="mut" id="tip"></div>
<div class="cc"><button class="btn" id="go">✂ 再切一刀</button><button class="btn ghost" id="rs">重来</button></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('无限切割');
var $=function(i){return document.getElementById(i)};

var n=0,COL=['#6366f1','#f59e0b','#22a06b','#e5484d','#0ea5e9','#a855f7','#14b8a6','#f97316'];
function fr(k){return k===0?'0':('1/2'.replace('2',Math.pow(2,1)))}
function draw(){var x=10,y=10,w=300,h=220,s='<rect x="10" y="10" width="300" height="220" fill="#fff" stroke="#334155" stroke-width="3"/>',i,terms=[],sum=0;
  for(i=1;i<=n;i++){var vert=i%2===1;if(vert){var nw=w/2;s+='<rect x="'+x+'" y="'+y+'" width="'+nw+'" height="'+h+'" fill="'+COL[(i-1)%8]+'" opacity=".85" stroke="#fff"/>';x+=nw;w=nw}else{var nh=h/2;s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+nh+'" fill="'+COL[(i-1)%8]+'" opacity=".85" stroke="#fff"/>';y+=nh;h=nh}terms.push('1/'+Math.pow(2,i));sum+=1/Math.pow(2,i)}
  $('s').innerHTML=s;var d=Math.pow(2,n);$('eq').innerHTML=n?terms.slice(0,6).join(' + ')+(n>6?' + …':'')+' = <span style="color:#4f46e5">'+(d-1)+'/'+d+'</span>':'整个正方形 = 1';
  $('tip').textContent=n?'还剩 1/'+d+' 没有涂。切得越多，涂色部分越接近 1，但永远比 1 少一点点。':'点“再切一刀”';if(n>=8)Hub.star('inf-cut',3);else if(n>=4)Hub.star('inf-cut',2);else if(n>=1)Hub.star('inf-cut',1)}
$('go').onclick=function(){if(n<12){n++;draw()}};$('rs').onclick=function(){n=0;draw()};draw();
</script></body></html>
