<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>三角形分类：拖一拖</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext" id="task"></div>
<svg id="s" viewBox="0 0 360 280" style="width:100%;max-width:560px;background:#fff;border-radius:10px"></svg>
<div style="font-size:22px;font-weight:800;margin-top:6px" id="cls"></div><div id="info" class="mut" style="line-height:1.7"></div><div class="msg" id="m"></div>
<div class="cc"><button class="btn ghost" id="nx">换一个目标</button><button class="btn ghost" id="fr">自由拖</button></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('三角形分类：拖一拖');
var $=function(i){return document.getElementById(i)};

var P=[[70,230],[290,230],[120,60]],drag=-1,task=null,sc=0,solved=false;
var GOALS=['锐角三角形','直角三角形','钝角三角形','等腰三角形','等边三角形','不等边三角形'];
function geo(){var d=function(a,b){return Math.hypot(P[a][0]-P[b][0],P[a][1]-P[b][1])/20},s=[d(1,2),d(0,2),d(0,1)],ag=[0,1,2].map(function(i){var a=P[i],b=P[(i+1)%3],c=P[(i+2)%3],v1=[b[0]-a[0],b[1]-a[1]],v2=[c[0]-a[0],c[1]-a[1]];return Math.acos((v1[0]*v2[0]+v1[1]*v2[1])/Math.hypot(v1[0],v1[1])/Math.hypot(v2[0],v2[1]))*180/Math.PI});return {s:s,a:ag}}
function cls(g){var m=Math.max.apply(null,g.a),byA=Math.abs(m-90)<2?'直角三角形':m>90?'钝角三角形':'锐角三角形',e=function(x,y){return Math.abs(x-y)<0.25},s=g.s,byS=(e(s[0],s[1])&&e(s[1],s[2]))?'等边三角形':(e(s[0],s[1])||e(s[1],s[2])||e(s[0],s[2]))?'等腰三角形':'不等边三角形';return [byA,byS]}
function draw(){var g=geo(),c=cls(g),s='',i;s+='<polygon points="'+P.map(function(p){return p.join(',')}).join(' ')+'" fill="rgba(99,102,241,.15)" stroke="#4338ca" stroke-width="3" stroke-linejoin="round"/>';
  for(i=0;i<3;i++){var cx=(P[0][0]+P[1][0]+P[2][0])/3,cy=(P[0][1]+P[1][1]+P[2][1])/3,dx=P[i][0]-cx,dy=P[i][1]-cy,l=Math.hypot(dx,dy)||1;
    s+='<circle data-i="'+i+'" cx="'+P[i][0]+'" cy="'+P[i][1]+'" r="13" fill="#f59e0b" stroke="#fff" stroke-width="3" style="cursor:grab"/><text x="'+(P[i][0]+dx/l*32)+'" y="'+(P[i][1]+dy/l*32+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#334155" pointer-events="none">'+Math.round(g.a[i])+'°</text>';
    var m=P[(i+1)%3],n=P[(i+2)%3];s+='<text x="'+((m[0]+n[0])/2+(((m[0]+n[0])/2-cx)>0?10:-10))+'" y="'+((m[1]+n[1])/2+(((m[1]+n[1])/2-cy)>0?16:-8))+'" text-anchor="middle" font-size="13" fill="#15803d" font-weight="700" pointer-events="none">'+g.s[i].toFixed(1)+' cm</text>'}
  $('s').innerHTML=s;$('cls').textContent=c[0]+' · '+c[1];$('info').innerHTML='三个角的和 = '+Math.round(g.a[0])+'° + '+Math.round(g.a[1])+'° + '+Math.round(g.a[2])+'° = '+Math.round(g.a[0]+g.a[1]+g.a[2])+'°';
  if(task){var ok=c.indexOf(task)>=0;if(ok&&!solved){solved=true;sc++;Hub.beep(true);Hub.star('triangle-types',sc>=4?3:sc>=2?2:1);$('m').className='msg ok';$('m').textContent='✔ 做到了！这是'+task+'（已完成 '+sc+' 个）'}else if(!ok){solved=false;$('m').textContent=''}}}
function pt(e){var r=$('s').getBoundingClientRect();return [(e.clientX-r.left)/r.width*360,(e.clientY-r.top)/r.height*280]}
$('s').addEventListener('pointerdown',function(e){var i=e.target.dataset.i;if(i!==undefined){drag=+i;$('s').setPointerCapture(e.pointerId)}});
$('s').addEventListener('pointermove',function(e){if(drag<0)return;var q=pt(e);P[drag]=[Math.max(15,Math.min(345,q[0])),Math.max(15,Math.min(265,q[1]))];draw()});
['pointerup','pointercancel'].forEach(function(k){$('s').addEventListener(k,function(){drag=-1})});
$('nx').onclick=function(){var t;do{t=GOALS[Hub.rnd(0,5)]}while(t===task);task=t;solved=false;$('task').innerHTML='拖动橙色顶点，做出一个<b style="color:#4f46e5">'+t+'</b>';$('m').textContent='';draw()};
$('fr').onclick=function(){task=null;$('task').textContent='自由拖动，看看三角形会变成哪一类';$('m').textContent='';draw()};
$('nx').onclick();
</script></body></html>
