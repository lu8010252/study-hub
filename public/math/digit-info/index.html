<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>数字与信息：身份证号里的秘密</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext">数字编码里藏着信息。自己设置一个“示例号码”，看每一段表示什么</div>
<div class="cc"><label>地区 <select id="rg" style="font-size:18px;padding:6px"></select></label><label>出生 <input type="date" id="bd" value="2016-05-18" style="font-size:18px;padding:6px"></label><label>性别 <select id="sx" style="font-size:18px;padding:6px"><option value="1">男</option><option value="0">女</option></select></label></div>
<div class="cc"><label>顺序号 <input type="number" id="sq" min="0" max="99" value="12" style="width:70px;font-size:18px;text-align:center"></label></div>
<div id="num" style="font:800 26px ui-monospace,Menlo,monospace;letter-spacing:2px;margin:10px 0;word-break:break-all"></div>
<div id="exp" style="text-align:left;max-width:560px;margin:0 auto;line-height:1.9"></div></div>
<div class="panel"><div class="qtext">🔍 看号码，答信息</div><div class="big2" id="qq" style="font-family:ui-monospace,Menlo,monospace"></div><div class="chs" id="ch"></div><div class="msg" id="m"></div><div class="cc"><button class="btn ghost" id="nx">换一题</button></div>
<div class="mut" style="text-align:center;margin-top:8px">（示例号码是程序随机生成的，不是真实的人。）</div></div>
<div class="panel"><b>邮政编码：</b>共 6 位。前 2 位表示省（自治区、直辖市），前 3 位表示邮区，前 4 位表示县（市），最后 2 位表示投递局（所）。例如 210000 里，“21”就是江苏省。</div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('数字与信息：身份证号里的秘密');
var $=function(i){return document.getElementById(i)};

var RG=[['320100','江苏省南京市'],['110100','北京市市辖区'],['310100','上海市市辖区'],['440100','广东省广州市'],['510100','四川省成都市']],sc=0,Q;
RG.forEach(function(r,i){var o=document.createElement('option');o.value=r[0];o.textContent=r[1];$('rg').appendChild(o)});
function chk(s17){var w=[7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2],m='10X98765432',t=0,i;for(i=0;i<17;i++)t+=(+s17[i])*w[i];return m[t%11]}
function build(rg,bd,sx,sq){var d=bd.replace(/-/g,''),o=String(sq).padStart(2,'0')+String(Hub.rnd(0,4)*2+(sx==='1'?1:0)===0?0:0);var seq=String(sq).padStart(2,'0')+(sx==='1'?[1,3,5,7,9][sq%5]:[0,2,4,6,8][sq%5]);var s17=rg+d+seq;return s17+chk(s17)}
function show(){var n=build($('rg').value,$('bd').value,$('sx').value,+$('sq').value||0);
  $('num').innerHTML='<span style="color:#6366f1">'+n.slice(0,6)+'</span> <span style="color:#d97706">'+n.slice(6,14)+'</span> <span style="color:#22a06b">'+n.slice(14,17)+'</span> <span style="color:#e5484d">'+n[17]+'</span>';
  var sexd=+n[16]%2?'奇数 → 男':'偶数 → 女';
  $('exp').innerHTML='<span style="color:#6366f1">■ 前 6 位</span> 地址码：'+RG.filter(function(r){return r[0]===n.slice(0,6)})[0][1]+'<br><span style="color:#d97706">■ 第 7~14 位</span> 出生日期：'+n.slice(6,10)+' 年 '+n.slice(10,12)+' 月 '+n.slice(12,14)+' 日<br><span style="color:#22a06b">■ 第 15~17 位</span> 顺序码，其中第 17 位是'+sexd+'<br><span style="color:#e5484d">■ 第 18 位</span> 校验码（由前 17 位算出）';
  if(!show.s){show.s=1}Hub.star('digit-info',1)}
['rg','bd','sx','sq'].forEach(function(i){$(i).addEventListener('input',show)});
function newQ(){var rg=RG[Hub.rnd(0,4)],y=Hub.rnd(2008,2018),m=Hub.rnd(1,12),d=Hub.rnd(1,28),sx=Hub.rnd(0,1)?'1':'0',bd=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'),n=build(rg[0],bd,sx,Hub.rnd(10,99)),k=Hub.rnd(0,1);
  Q={k:k};$('qq').textContent=n;
  if(k===0){Q.a=y+'年'+m+'月'+d+'日';var o=[Q.a,(y+1)+'年'+m+'月'+d+'日',y+'年'+d+'月'+m+'日',(y-1)+'年'+m+'月'+d+'日'].filter(function(x,i,a){return a.indexOf(x)===i});while(o.length<4)o.push(y+'年'+Hub.rnd(1,12)+'月'+Hub.rnd(1,28)+'日');o.sort(function(){return Math.random()-.5});$('ch').innerHTML=o.map(function(x){return '<button class="ch" data-c="'+x+'">'+x+'</button>'}).join('');$('qq').insertAdjacentHTML('afterend','')}
  else{Q.a=sx==='1'?'男':'女';$('ch').innerHTML='<button class="ch" data-c="男">男</button><button class="ch" data-c="女">女</button>'}
  $('qq').setAttribute('title',k===0?'出生日期':'性别');$('m').textContent='';Q.h=k===0?'这个人的出生日期是？（看第 7~14 位）':'这个人是男是女？（看第 17 位的奇偶）';$('m').className='msg';$('m').textContent=Q.h}
$('ch').addEventListener('click',function(e){var c=e.target.dataset.c;if(c===undefined||!Q)return;var good=c===Q.a;Hub.beep(good);if(good){sc++;Hub.star('digit-info',sc>=4?3:sc>=2?2:1)}$('m').className='msg '+(good?'ok':'bad');$('m').textContent=good?'✔ 答对了（已对 '+sc+' 题）':'✘ 正确答案：'+Q.a;Q=null});
$('nx').onclick=newQ;show();newQ();
</script></body></html>
