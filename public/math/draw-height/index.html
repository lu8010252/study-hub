<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>画高：拖出三角形的高</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext" id="q"></div>
<div class="cc" id="bb"></div>
<svg id="s" viewBox="0 0 400 260" style="width:100%;max-width:640px;background:#f8fafc;border-radius:12px"></svg>
<div id="out" style="font-size:19px;line-height:1.8;min-height:62px"></div>
<div class="cc"><button class="btn" id="nw">换一个三角形</button><button class="btn ghost" id="hint">显示答案</button></div></div>
<div class="panel"><b>记住：</b>高是从顶点<b>向对边画垂线</b>，顶点到垂足之间的线段就是高。<br>锐角三角形的高在里面；直角三角形的两条直角边互相是高；钝角三角形有的高在<b>外面</b>，要把底边延长。<br>同一个三角形有 3 条高，选的底边不同，高就不同。</div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('画高：拖出三角形的高');
var $=function(i){return document.getElementById(i)};

var T,bi=0,H=0,done={},show=false,drag=false,kind='';
var NS='http://www.w3.org/2000/svg';
function rnd(a,b){return Math.floor(a+Math.random()*(b-a+1))}
function gen(){var k=['锐角','直角','钝角'][rnd(0,2)],A,B,C;
  B=[rnd(50,90),200];C=[rnd(250,330),200];
  if(k==='锐角')A=[rnd(B[0]+50,C[0]-50),rnd(50,90)];
  else if(k==='直角'){A=[B[0],rnd(50,90)];if(Math.random()<.5)A=[C[0],rnd(50,90)]}
  else A=[Math.random()<.5?rnd(B[0]-50,B[0]-15):rnd(C[0]+15,Math.min(C[0]+50,380)),rnd(60,100)];
  T=[A,B,C];kind=k;bi=0;done={};show=false;H=null;pick()}
function side(i){/* 第 i 条边: 底边的两个端点, 对顶点 */var a=T[(i+1)%3],b=T[(i+2)%3],v=T[i];return {a:a,b:b,v:v}}
var NM=['A','B','C'];
function foot(sd){var dx=sd.b[0]-sd.a[0],dy=sd.b[1]-sd.a[1],t=((sd.v[0]-sd.a[0])*dx+(sd.v[1]-sd.a[1])*dy)/(dx*dx+dy*dy);return t}
function pick(){var sd=side(bi);if(H===null||H.bi!==bi)H={bi:bi,t:Math.random()<.5?0.15:0.85};
  var f=foot(sd);if(Math.abs(H.t-f)<.12)H.t=f>.5?.1:.9}
function pt(sd,t){return [sd.a[0]+(sd.b[0]-sd.a[0])*t,sd.a[1]+(sd.b[1]-sd.a[1])*t]}
function draw(){var sd=side(bi),s='',f=foot(sd),F=pt(sd,f),P=pt(sd,H.t),v=sd.v,ok=Math.abs(H.t-f)*Math.hypot(sd.b[0]-sd.a[0],sd.b[1]-sd.a[1])<7;
  $('q').innerHTML='这是一个<b>'+kind+'三角形</b>。以 <b style="color:#e5484d">'+NM[(bi+1)%3]+NM[(bi+2)%3]+'</b> 为底，拖动小圆点，画出从顶点 '+NM[bi]+' 到底边的高';
  $('bb').innerHTML=[0,1,2].map(function(i){return '<button class="btn '+(i===bi?'':'ghost')+'" data-b="'+i+'">底边 '+NM[(i+1)%3]+NM[(i+2)%3]+(done[i]?' ✅':'')+'</button>'}).join('');
  s+='<polygon points="'+T.map(function(p){return p.join(',')}).join(' ')+'" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3" stroke-linejoin="round"/>';
  /* 延长底边 */var ext=pt(sd,Math.min(H.t,f,0)-.1),ext2=pt(sd,Math.max(H.t,f,1)+.1);
  s+='<line x1="'+ext[0]+'" y1="'+ext[1]+'" x2="'+ext2[0]+'" y2="'+ext2[1]+'" stroke="#e5484d" stroke-width="3"'+((f<0||f>1||H.t<0||H.t>1)?'':'')+'/>';
  s+='<line x1="'+sd.a[0]+'" y1="'+sd.a[1]+'" x2="'+sd.b[0]+'" y2="'+sd.b[1]+'" stroke="#e5484d" stroke-width="5"/>';
  s+='<line x1="'+v[0]+'" y1="'+v[1]+'" x2="'+P[0]+'" y2="'+P[1]+'" stroke="'+(ok?'#22a06b':'#f59e0b')+'" stroke-width="4" stroke-dasharray="'+(ok?'0':'8 5')+'"/>';
  if(ok){var ux=(sd.b[0]-sd.a[0]),uy=(sd.b[1]-sd.a[1]),L=Math.hypot(ux,uy);ux/=L;uy/=L;var wx=v[0]-F[0],wy=v[1]-F[1],M=Math.hypot(wx,wy);wx/=M;wy/=M;var q=14;
    s+='<polyline points="'+(F[0]+ux*q)+','+(F[1]+uy*q)+' '+(F[0]+ux*q+wx*q)+','+(F[1]+uy*q+wy*q)+' '+(F[0]+wx*q)+','+(F[1]+wy*q)+'" fill="none" stroke="#22a06b" stroke-width="2.5"/>'}
  if(show){s+='<line x1="'+v[0]+'" y1="'+v[1]+'" x2="'+F[0]+'" y2="'+F[1]+'" stroke="#22a06b" stroke-width="3" opacity=".6"/>'}
  s+=T.map(function(p,i){var dy=i===bi?-10:(p[1]>150?18:-10);return '<text x="'+p[0]+'" y="'+(p[1]+dy)+'" text-anchor="middle" font-size="18" font-weight="800" fill="#312e81">'+NM[i]+'</text>'}).join('');
  s+='<circle id="dot" cx="'+P[0]+'" cy="'+P[1]+'" r="16" fill="'+(ok?'#22a06b':'#f59e0b')+'" stroke="#fff" stroke-width="3" style="cursor:grab"/>';
  $('s').innerHTML=s;
  var len=Math.hypot(v[0]-P[0],v[1]-P[1])/20;
  if(ok){done[bi]=1;$('out').innerHTML='✅ 垂直了！线段 '+NM[bi]+'→垂足 就是 <b>以 '+NM[(bi+1)%3]+NM[(bi+2)%3]+' 为底的高</b>，长度约 '+len.toFixed(1)+' 厘米。'+(f<0||f>1?'<br>垂足落在底边的<b>延长线</b>上（钝角三角形的高在外面）。':'');
    if(Object.keys(done).length===3){$('out').innerHTML+='<br>🎉 三条高都画好了！三条高的长度不一样，底边越长，对应的高越短。';Hub.star('draw-height',3);Hub.beep&&Hub.beep(1)}else Hub.star('draw-height',1)}
  else $('out').innerHTML='现在这条线长约 '+len.toFixed(1)+' 厘米，还<b>没有垂直</b>于底边。拖动圆点，让线变短、直到出现 ⌐ 直角标记。<br><span class="mut">垂线段是最短的。</span>'}
function svgpt(e){var r=$('s').getBoundingClientRect();return [(e.clientX-r.left)*400/r.width,(e.clientY-r.top)*260/r.height]}
$('s').addEventListener('pointerdown',function(e){if(e.target.id==='dot'){drag=true;$('s').setPointerCapture(e.pointerId)}});
$('s').addEventListener('pointermove',function(e){if(!drag)return;var sd=side(bi),p=svgpt(e),dx=sd.b[0]-sd.a[0],dy=sd.b[1]-sd.a[1],t=((p[0]-sd.a[0])*dx+(p[1]-sd.a[1])*dy)/(dx*dx+dy*dy);H.t=Math.max(-.6,Math.min(1.6,t));
  var f=foot(sd),L=Math.hypot(dx,dy);if(Math.abs(H.t-f)*L<9)H.t=f;draw()});
$('s').addEventListener('pointerup',function(){drag=false});$('s').addEventListener('pointercancel',function(){drag=false});
$('bb').addEventListener('click',function(e){var b=e.target.getAttribute('data-b');if(b===null)return;bi=+b;show=false;H=null;pick();draw()});
$('nw').onclick=function(){gen();draw()};$('hint').onclick=function(){show=!show;draw()};
gen();draw();
</script></body></html>
