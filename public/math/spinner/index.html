<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>转盘与可能性</title><link rel="stylesheet" href="/css/hub.css"></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="row" id="pre" style="justify-content:center"></div>
<svg id="s" viewBox="0 0 300 300" style="width:100%;max-width:300px"><g id="wheel"></g><polygon points="150,2 138,-4 162,-4" fill="#23224a" transform="translate(0,16)"/></svg>
<div class="row" style="justify-content:center"><button class="btn" id="go1">转 1 次</button><button class="btn" id="go10">转 10 次</button><button class="btn ghost" id="go100">转 100 次</button><button class="btn ghost" id="rs">清零</button></div>
<div id="tab" style="margin-top:10px"></div></div></div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('转盘与可能性');
var $=function(i){return document.getElementById(i)};
var SETS=[{n:'红 1/2、蓝 1/2',p:[1,1]},{n:'红 1/4、蓝 3/4',p:[1,3]},{n:'红 1/6、蓝 5/6',p:[1,5]},{n:'红 1/3、黄 1/3、蓝 1/3',p:[1,1,1]},{n:'红 1/2、黄 1/4、蓝 1/4',p:[2,1,1]}];
var COLS=['#e5484d','#f59e0b','#3b82f6'],NAMES=['红','黄','蓝'],cur=SETS[1],cnt=[],rot=0,total=0;
function names(){return cur.p.length===2?['红','蓝']:['红','黄','蓝']}
function colors(){return cur.p.length===2?['#e5484d','#3b82f6']:COLS}
function reset(){cnt=cur.p.map(function(){return 0});total=0;draw()}
function wheel(){
  var sum=cur.p.reduce(function(a,b){return a+b}),a0=0,s='',C=colors();
  cur.p.forEach(function(w,i){var a1=a0+w/sum*2*Math.PI,x0=150+130*Math.sin(a0),y0=150-130*Math.cos(a0),x1=150+130*Math.sin(a1),y1=150-130*Math.cos(a1);
    s+='<path d="M150 150 L'+x0+' '+y0+' A130 130 0 '+(a1-a0>Math.PI?1:0)+' 1 '+x1+' '+y1+' Z" fill="'+C[i]+'" stroke="#fff" stroke-width="3"/>';a0=a1});
  $('wheel').setAttribute('transform','rotate('+rot+' 150 150)');$('wheel').innerHTML=s;
}
function draw(){
  wheel();var sum=cur.p.reduce(function(a,b){return a+b}),N=names(),C=colors(),h='<table style="margin:0 auto;border-collapse:collapse"><tr><th></th>'+N.map(function(n,i){return '<th style="color:'+C[i]+';padding:4px 12px">'+n+'</th>'}).join('')+'</tr>';
  h+='<tr><td style="padding:4px 8px">次数</td>'+cnt.map(function(c){return '<td><b>'+c+'</b></td>'}).join('')+'</tr>';
  h+='<tr><td style="padding:4px 8px">实际占比</td>'+cnt.map(function(c){return '<td>'+(total?(c/total*100).toFixed(0)+'%':'—')+'</td>'}).join('')+'</tr>';
  h+='<tr><td style="padding:4px 8px">理论可能性</td>'+cur.p.map(function(w){return '<td>'+U2(w,sum)+'</td>'}).join('')+'</tr></table><p style="color:var(--sub)">共转 '+total+' 次。转得越多，实际占比就越接近理论可能性。</p>';
  $('tab').innerHTML=h;
}
function U2(a,b){var g=(function f(x,y){return y?f(y,x%y):x})(a,b);return (a/g)+'/'+(b/g)}
function spin(n){var sum=cur.p.reduce(function(a,b){return a+b});for(var i=0;i<n;i++){var r=Math.random()*sum,k=0;while(r>=cur.p[k]){r-=cur.p[k];k++}cnt[k]++;total++;if(i===n-1)rot=360*4+(Math.random()*360)}draw();if(total>=100)Hub.star('spinner',3);else if(total>=30)Hub.star('spinner',2);else Hub.star('spinner',1)}
$('pre').innerHTML=SETS.map(function(s,i){return '<button class="btn ghost" data-i="'+i+'" style="min-height:38px;font-size:14px">'+s.n+'</button>'}).join('');
$('pre').onclick=function(e){var i=e.target.dataset.i;if(i!==undefined){cur=SETS[+i];reset()}};
$('go1').onclick=function(){spin(1)};$('go10').onclick=function(){spin(10)};$('go100').onclick=function(){spin(100)};$('rs').onclick=reset;
reset();
</script></body></html>
