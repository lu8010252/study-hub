<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>三位数乘两位数：面积图</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="cc"><button class="btn" data-m="a">面积图与竖式</button><button class="btn ghost" data-m="r">积的变化规律</button></div>
<div id="A">
<div class="sl"><b id="la"></b><input type="range" min="100" max="999" value="236" id="a"></div>
<div class="sl"><b id="lb"></b><input type="range" min="10" max="99" value="34" id="b"></div>
<svg id="s" viewBox="0 0 360 150" style="width:100%;max-width:560px"></svg>
<div class="mut">点一点每个格子，看看它是怎么算出来的</div>
<pre id="v" style="font:700 24px/1.4 ui-monospace,Menlo,monospace;display:inline-block;text-align:right;margin:8px 0"></pre><div id="ex" class="qtext"></div></div>
<div id="R" style="display:none">
<div class="qtext">24 × 15 = 360。让两个因数变一变，积怎么变？</div>
<div class="sl"><b>第一个因数 × </b><span class="cc" id="m1" style="margin:0"></span></div>
<div class="sl"><b>第二个因数 × </b><span class="cc" id="m2" style="margin:0"></span></div>
<div class="big2" id="rr"></div><div class="mut" id="rt"></div></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('三位数乘两位数：面积图');
var $=function(i){return document.getElementById(i)};

var M1=1,M2=1,sel=-1;
function parts(n){var r=[],h=Math.floor(n/100),t=Math.floor(n/10)%10,o=n%10;if(h)r.push(h*100);if(t)r.push(t*10);if(o||!r.length)r.push(o);return r}
function drawA(){var a=+$('a').value,b=+$('b').value,pa=parts(a),pb=parts(b);$('la').textContent='第一个因数 '+a;$('lb').textContent='第二个因数 '+b;
  var cw=300/pa.length,ch=54,col=['#c7d2fe','#fde68a','#99f6e4'],s='',i,j,k=0;
  pa.forEach(function(x,i){s+='<text x="'+(50+i*cw+cw/2)+'" y="16" text-anchor="middle" font-size="14" font-weight="700">'+x+'</text>'});
  pb.forEach(function(y,j){s+='<text x="40" y="'+(24+j*ch+ch/2+5)+'" text-anchor="end" font-size="14" font-weight="700">'+y+'</text>';pa.forEach(function(x,i){var id=j*10+i;s+='<rect data-c="'+id+'" x="'+(50+i*cw)+'" y="'+(24+j*ch)+'" width="'+(cw-3)+'" height="'+(ch-3)+'" rx="6" fill="'+col[(i+j)%3]+'" stroke="'+(sel===id?'#e5484d':'#64748b')+'" stroke-width="'+(sel===id?3:1)+'"/><text pointer-events="none" x="'+(50+i*cw+cw/2)+'" y="'+(24+j*ch+ch/2+5)+'" text-anchor="middle" font-size="'+(cw<80?13:16)+'" font-weight="700">'+(sel===id?x+'×'+y+'='+x*y:x*y)+'</text>'})});
  $('s').setAttribute('viewBox','0 0 360 '+(30+pb.length*ch));$('s').innerHTML=s;
  var p1=a*(b%10),p2=a*Math.floor(b/10),w=String(a*b).length+2,pd=function(x,e){var t=String(x)+e;while(t.length<w)t=' '+t;return t};
  $('v').textContent=pd(a,'')+'\n× '+pd(b,'').trim().padStart(w-2,' ')+'\n'+'─'.repeat(w)+'\n'+pd(p1,'')+'  ← '+a+' × '+(b%10)+'（个位）\n'+pd(p2,'0').replace(/^ /,'')+'  ← '+a+' × '+Math.floor(b/10)+'（十位，末尾添 0）\n'+'─'.repeat(w)+'\n'+pd(a*b,'');
  $('ex').innerHTML=a+' × '+b+' = '+pa.map(function(x){return x}).join('、')+' 分别乘 '+pb.join('、')+'，再把 '+(pa.length*pb.length)+' 块加起来 = <b>'+a*b+'</b>'}
['a','b'].forEach(function(i){$(i).addEventListener('input',function(){sel=-1;drawA()})});
$('s').addEventListener('pointerdown',function(e){var c=e.target.dataset.c;if(c!==undefined){sel=sel===+c?-1:+c;drawA()}});
var OPT=[1,2,3,4,5,10];
function drawR(){var f=function(id,k,cur){$(id).innerHTML=OPT.map(function(x){return '<button class="btn '+(x===cur?'':'ghost')+'" data-k="'+id+x+'" style="min-width:48px">'+x+'</button>'}).join('')};f('m1',0,M1);f('m2',0,M2);
  var A=24*M1,B=15*M2;$('rr').textContent=A+' × '+B+' = '+A*B;$('rt').textContent=(M1>1||M2>1)?'第一个因数 × '+M1+'，第二个因数 × '+M2+'，积 × '+(M1*M2)+'（360 × '+(M1*M2)+' = '+360*M1*M2+'）':'一个因数乘几，积就乘几；两个因数分别乘几和几，积就乘它们的积';
  if(M1*M2>=10&&!drawR.s){drawR.s=1;Hub.star('mult-area',3)}}
document.addEventListener('click',function(e){var k=e.target.dataset.k,m=e.target.dataset.m;if(k){if(k[1]==='1')M1=+k.slice(2);else M2=+k.slice(2);drawR()}
  if(m){[].forEach.call(document.querySelectorAll('[data-m]'),function(x){x.classList.toggle('ghost',x.dataset.m!==m)});$('A').style.display=m==='a'?'':'none';$('R').style.display=m==='r'?'':'none';if(m==='r')drawR();else drawA()}});
drawA();
</script></body></html>
