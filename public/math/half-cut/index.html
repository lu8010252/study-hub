<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>无限切割：每次切掉一半</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext">把一张正方形纸每次切走剩下的一半，会怎么样？</div>
<svg id="s" viewBox="0 0 220 220" style="width:100%;max-width:320px"></svg>
<div class="cc"><button class="btn" id="go">✂️ 再切一次</button><button class="btn ghost" id="auto">自动切</button><button class="btn ghost" id="rs">重来</button></div>
<div id="out" style="font-size:19px;line-height:1.9"></div></div>
<div class="panel"><b>发现：</b>1/2 + 1/4 + 1/8 + …… 加得越多，越接近 1，但永远比 1 少一点点——剩下的那一小块 1/2ⁿ 永远切不完。</div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('无限切割：每次切掉一半');
var $=function(i){return document.getElementById(i)};

var n=0,tm=null,COL=['#6366f1','#f59e0b','#22a06b','#e5484d','#0ea5e9','#a855f7'];
function draw(){var s='<rect x="10" y="10" width="200" height="200" fill="#fff" stroke="#334155" stroke-width="2"/>',x=10,y=10,w=200,h=200,i,sum='',fr=[];
  for(i=1;i<=n;i++){var vert=i%2===1,pw,ph,px,py;if(vert){pw=w/2;ph=h;px=x;py=y;x+=pw;w=pw}else{pw=w;ph=h/2;px=x;py=y;y+=ph;h=ph}
    s+='<rect x="'+px+'" y="'+py+'" width="'+pw+'" height="'+ph+'" fill="'+COL[(i-1)%6]+'" fill-opacity=".75" stroke="#fff" stroke-width="1.5"/>';if(i<=6)s+='<text x="'+(px+pw/2)+'" y="'+(py+ph/2+5)+'" text-anchor="middle" font-size="'+(i<4?20:13)+'" font-weight="700" fill="#fff">1/'+Math.pow(2,i)+'</text>'}
  if(n>0)s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="none" stroke="#e5484d" stroke-width="2" stroke-dasharray="4 3"/>';
  $('s').innerHTML=s;var terms=[];for(i=1;i<=Math.min(n,6);i++)terms.push('1/'+Math.pow(2,i));
  var left=n===0?1:1/Math.pow(2,n),got=1-left;
  $('out').innerHTML=n===0?'这是整张纸，面积是 1':'已经切走：'+terms.join(' + ')+(n>6?' + …':'')+' = <b>'+(n<=20?'1 − 1/'+Math.pow(2,n):'接近 1')+'</b><br>约 '+(got*100).toFixed(n>7?4:2)+'% 的纸；<span style="color:#e5484d">红框里还剩 1/'+Math.pow(2,n)+'</span>（红框永远不会消失）';
  if(n>=8)Hub.star('half-cut',3);else if(n>=4)Hub.star('half-cut',2);else if(n>=1)Hub.star('half-cut',1)}
$('go').onclick=function(){if(n<30){n++;Hub.beep(true);draw()}};$('rs').onclick=function(){clearInterval(tm);n=0;draw()};
$('auto').onclick=function(){clearInterval(tm);tm=setInterval(function(){if(n>=14){clearInterval(tm);return}n++;draw()},500)};draw();
</script></body></html>
