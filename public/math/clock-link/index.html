<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>时针和分针的联动</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext">拖动<b style="color:#e5484d">红色分针</b>转一转，看<b style="color:#4338ca">蓝色时针</b>怎么动</div>
<svg id="s" viewBox="0 0 200 200" style="width:100%;max-width:320px"></svg>
<div class="big2" id="t"></div><div id="inf" style="line-height:1.8"></div>
<div class="cc"><button class="btn ghost" data-a="1">+1 分</button><button class="btn ghost" data-a="5">+5 分</button><button class="btn" data-a="60">+1 时</button><button class="btn ghost" data-a="-60">−1 时</button></div></div>
<div class="panel"><b>规律：</b>分针走 1 圈（60 分），时针正好走 1 大格（1 时）；分针走 1 小格（1 分），时针走半度。1 时 = 60 分，一天 = 24 时。</div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('时针和分针的联动');
var $=function(i){return document.getElementById(i)};
function clockSvg(h,m,numbers,hands){var s='<circle cx="100" cy="100" r="92" fill="#fff" stroke="#334155" stroke-width="5"/>',i;
  for(i=0;i<60;i++){var a=i*6*Math.PI/180,r1=i%5?86:80;s+='<line x1="'+(100+Math.sin(a)*r1)+'" y1="'+(100-Math.cos(a)*r1)+'" x2="'+(100+Math.sin(a)*90)+'" y2="'+(100-Math.cos(a)*90)+'" stroke="#334155" stroke-width="'+(i%5?1:2.5)+'"/>'}
  if(numbers)for(i=1;i<=12;i++){var b=i*30*Math.PI/180;s+='<text x="'+(100+Math.sin(b)*66)+'" y="'+(100-Math.cos(b)*66+6)+'" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">'+i+'</text>'}
  var ha=((h%12)*30+m*.5)*Math.PI/180,ma=m*6*Math.PI/180;
  s+='<line x1="100" y1="100" x2="'+(100+Math.sin(ha)*46)+'" y2="'+(100-Math.cos(ha)*46)+'" stroke="#4338ca" stroke-width="7" stroke-linecap="round"/><line x1="100" y1="100" x2="'+(100+Math.sin(ma)*70)+'" y2="'+(100-Math.cos(ma)*70)+'" stroke="#e5484d" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="5" fill="#334155"/>';return s}
var T=9*60+15,drag=false,last=0;
function f2(n){return (n<10?'0':'')+n}
function draw(){var h=Math.floor(T/60),m=T%60,s=clockSvg(h,m,true);
  var ma=m*6*Math.PI/180;s+='<circle id="hd" cx="'+(100+Math.sin(ma)*70)+'" cy="'+(100-Math.cos(ma)*70)+'" r="11" fill="#e5484d" opacity=".85" style="cursor:grab"/>';$('s').innerHTML=s;
  var h24=Math.floor(T/60)%24;$('t').textContent=f2(h24)+':'+f2(m)+'（'+(h24%12||12)+' 时 '+m+' 分）';
  $('inf').innerHTML='分针转了 '+(m*6)+'°，时针转了 '+((h24%12)*30+m*.5)+'°<br>已经走了 '+T+' 分，共 '+(Math.floor(T/60))+' 时 '+m+' 分';
  if(T>=24*60)T-=24*60}
function pt(e){var r=$('s').getBoundingClientRect();return [(e.clientX-r.left)/r.width*200-100,(e.clientY-r.top)/r.height*200-100]}
$('s').addEventListener('pointerdown',function(e){if(e.target.id==='hd'){drag=true;$('s').setPointerCapture(e.pointerId);var q=pt(e);last=Math.atan2(q[0],-q[1])*180/Math.PI}});
$('s').addEventListener('pointermove',function(e){if(!drag)return;var q=pt(e),a=Math.atan2(q[0],-q[1])*180/Math.PI,d=a-last;if(d>180)d-=360;if(d<-180)d+=360;last=a;T=Math.max(0,T+d/6);T=Math.round(T*100)/100;T=(T+1440)%1440;drawR()});
function drawR(){var Tr=T;T=Math.round(T);draw();T=Tr}
['pointerup','pointercancel'].forEach(function(k){$('s').addEventListener(k,function(){drag=false;T=Math.round(T);draw()})});
document.addEventListener('click',function(e){var a=e.target.dataset.a;if(a){T=((Math.round(T)+ +a)%1440+1440)%1440;draw();Hub.star('clock-link',1)}});draw();
</script></body></html>
