<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>量角器</title><link rel="stylesheet" href="/css/hub.css"></head>
<body><div class="page">
<div class="panel" style="text-align:center">
 <div><span class="big" id="deg"></span> <span id="kind" style="font-size:22px;font-weight:700;color:var(--p1)"></span></div>
 <svg id="s" viewBox="0 0 400 250" style="width:100%;max-width:640px"></svg>
 <p style="color:var(--sub)">拖动橙色圆点转动射线（也可以点量角器上任意位置）</p>
</div>
<div class="panel" style="text-align:center">
 <div class="row" style="justify-content:center"><button class="btn" id="m1">拖出指定角度</button><button class="btn ghost" id="m2">猜一猜（不显示读数）</button></div>
 <div id="task" style="font-weight:700;font-size:20px;margin-top:10px"></div>
 <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="chk">检查</button><button class="btn ghost" id="nx">换一题</button></div>
 <div class="msg" id="m"></div>
</div></div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('量角器');
var $=function(i){return document.getElementById(i)};
var CX=200,CY=225,R=170,ang=45,drag=false,mode=1,goal=0,solved=0,svg=$('s'),hide=false;
function xy(a,r){var t=a*Math.PI/180;return [CX+r*Math.cos(t),CY-r*Math.sin(t)]}
function kind(a){return a===0?'':a<90?'锐角':a===90?'直角':a<180?'钝角':'平角'}
function draw(){
  var s='<path d="M'+(CX-R)+' '+CY+' A'+R+' '+R+' 0 0 1 '+(CX+R)+' '+CY+' Z" fill="#a5b4fc" fill-opacity=".18" stroke="currentColor" stroke-opacity=".5"/>',i;
  for(i=0;i<=180;i+=5){var a=xy(i,R),b=xy(i,R-(i%10===0?(i%30===0?22:14):8));s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="currentColor" stroke-opacity=".6"/>';
    if(i%30===0){var t=xy(i,R-36);s+='<text x="'+t[0]+'" y="'+(t[1]+5)+'" text-anchor="middle" font-size="14" fill="currentColor">'+i+'</text>'}}
  s+='<line x1="'+CX+'" y1="'+CY+'" x2="'+(CX+R+15)+'" y2="'+CY+'" stroke="#6366f1" stroke-width="4"/>';
  var e=xy(ang,R+15),arc=xy(ang,45);
  s+='<path d="M'+(CX+45)+' '+CY+' A45 45 0 0 0 '+arc[0]+' '+arc[1]+'" fill="none" stroke="#f59e0b" stroke-width="3"/>';
  s+='<line x1="'+CX+'" y1="'+CY+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="#e5484d" stroke-width="4"/><circle id="h" cx="'+e[0]+'" cy="'+e[1]+'" r="15" fill="#f59e0b" stroke="#fff" stroke-width="3" style="cursor:grab"/>';
  if(mode===2){var g=xy(goal,R+15);s+='<line x1="'+CX+'" y1="'+CY+'" x2="'+g[0]+'" y2="'+g[1]+'" stroke="#22a06b" stroke-width="4" stroke-dasharray="8 6"/>'}
  s+='<circle cx="'+CX+'" cy="'+CY+'" r="5" fill="currentColor"/>';
  svg.innerHTML=s;
  $('deg').textContent=hide?'？':ang+'°';$('kind').textContent=hide?'':kind(ang);
}
function setFrom(e){var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*400,y=(e.clientY-r.top)/r.height*250;
  var a=Math.round(Math.atan2(CY-y,x-CX)*180/Math.PI);if(a<0)a=(x<CX)?180:0;ang=Math.max(0,Math.min(180,a));draw()}
svg.addEventListener('pointerdown',function(e){drag=true;svg.setPointerCapture(e.pointerId);setFrom(e)});
svg.addEventListener('pointermove',function(e){if(drag)setFrom(e)});
function up(){drag=false}svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
function pick(){
  $('m').textContent='';goal=Hub.rnd(1,35)*5;
  if(mode===1){hide=false;$('task').textContent='把射线拖到 '+goal+'°'}
  else{hide=true;ang=90;$('task').textContent='绿色虚线是一个角，转动红色射线盖住它（读数先藏起来，凭感觉估）'}
  draw();
}
$('m1').onclick=function(){mode=1;$('m1').className='btn';$('m2').className='btn ghost';pick()};
$('m2').onclick=function(){mode=2;$('m2').className='btn';$('m1').className='btn ghost';pick()};
$('chk').onclick=function(){
  var diff=Math.abs(ang-goal),tol=mode===1?2:6;
  hide=false;
  if(diff<=tol){solved++;$('m').className='msg ok';$('m').textContent='✔ '+(mode===1?'拖对了！':'真准！这个角约 '+goal+'°，你拖的是 '+ang+'°')+'已完成 '+solved+' 题';Hub.beep(true);Hub.star('angle',solved>=5?3:solved>=3?2:1)}
  else{$('m').className='msg bad';$('m').textContent=mode===1?'现在是 '+ang+'°，目标 '+goal+'°':'这个角其实是 '+goal+'°，你估的是 '+ang+'°';Hub.beep(false)}
  draw();
};
$('nx').onclick=pick;
pick();
</script></body></html>
