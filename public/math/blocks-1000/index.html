<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>数的组成：千以内的数</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext">点按钮添加或拿走，满十自动进一</div>
<div class="cc" id="bt"></div>
<svg id="s" viewBox="0 0 360 150" style="width:100%;max-width:600px;background:#fff;border-radius:10px"></svg>
<div class="big2" style="font-size:44px" id="num"></div><div class="big2" id="cn"></div><div class="mut" id="pv"></div><div class="msg" id="m"></div>
<div class="cc"><button class="btn ghost" id="rs">清空</button><button class="btn ghost" id="tg">出个题</button></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('数的组成：千以内的数');
var $=function(i){return document.getElementById(i)};
var CN=['零','一','二','三','四','五','六','七','八','九'];function cnN(n){if(n<10)return CN[n];if(n<20)return '十'+(n%10?CN[n%10]:'');return CN[Math.floor(n/10)]+'十'+(n%10?CN[n%10]:'')}
var N=0,goal=null,sc=0;
var BT=[['+1',1],['+10',10],['+100',100],['+1000',1000],['−1',-1],['−10',-10],['−100',-100]];
function g4(n){var d=[Math.floor(n/1000),Math.floor(n/100)%10,Math.floor(n/10)%10,n%10],s='',z=false,NM=['','十','百','千'];for(var i=0;i<4;i++){var x=d[i],u=NM[3-i];if(x===0){if(s)z=true}else{if(z){s+='零';z=false}s+=CN[x]+u}}return s}
function draw(){var q=Math.floor(N/1000),b=Math.floor(N/100)%10,t=Math.floor(N/10)%10,o=N%10,s='',i,j;
  /* 千 */if(q)s+='<rect x="8" y="30" width="58" height="58" rx="4" fill="#c7d2fe" stroke="#4338ca"/><text x="37" y="64" text-anchor="middle" font-weight="800" font-size="16">1000</text>';
  /* 百 */s+='<text x="75" y="22" font-size="12" fill="#64748b">百</text>';for(i=0;i<b;i++)s+='<rect x="'+(75+(i%3)*26)+'" y="'+(30+Math.floor(i/3)*26)+'" width="24" height="24" fill="#fde68a" stroke="#d97706"/>';
  s+='<text x="170" y="22" font-size="12" fill="#64748b">十</text>';for(i=0;i<t;i++)s+='<rect x="'+(170+i*13)+'" y="30" width="10" height="90" fill="#99f6e4" stroke="#0f766e"/>';
  s+='<text x="170" y="136" font-size="12" fill="#64748b"></text><text x="310" y="22" font-size="12" fill="#64748b">一</text>';for(i=0;i<o;i++)s+='<rect x="'+(310+(i%3)*16)+'" y="'+(30+Math.floor(i/3)*16)+'" width="13" height="13" fill="#fbcfe8" stroke="#be185d"/>';
  $('s').innerHTML=s;$('num').textContent=N;$('cn').textContent=N?g4(N):'零';$('pv').textContent=(q?q+' 个千 ':'')+(b?b+' 个百 ':'')+(t?t+' 个十 ':'')+(o?o+' 个一':'');
  $('bt').innerHTML=BT.map(function(x){return '<button class="btn '+(x[1]>0?'':'ghost')+'" data-b="'+x[1]+'" style="min-width:64px">'+x[0]+'</button>'}).join('');
  if(goal!==null&&N===goal){sc++;Hub.beep(true);Hub.star('blocks-1000',sc>=3?3:sc>=2?2:1);$('m').className='msg ok';$('m').textContent='✔ 摆对了！'+goal+' 读作 '+g4(goal);goal=null}}
document.addEventListener('click',function(e){var b=e.target.dataset.b;if(b){var d=+b;N=Math.max(0,Math.min(9999,N+d));draw()}});
$('rs').onclick=function(){N=0;draw()};$('tg').onclick=function(){goal=Hub.rnd(11,999);N=0;$('m').className='msg';$('m').textContent='请摆出：'+g4(goal)+'（'+goal+'）';draw()};draw();
</script></body></html>
