<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>时间换算器</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext">时、分、秒，天、时、分，自己试一试</div>
<div style="font-size:20px;line-height:2.4">
<input type="number" id="h" min="0" value="2" style="width:80px;font-size:22px;text-align:center;border:2px solid var(--line);border-radius:10px"> 时
<input type="number" id="m" min="0" value="35" style="width:80px;font-size:22px;text-align:center;border:2px solid var(--line);border-radius:10px"> 分
<input type="number" id="s" min="0" value="20" style="width:80px;font-size:22px;text-align:center;border:2px solid var(--line);border-radius:10px"> 秒</div>
<div id="out" style="font-size:19px;line-height:1.9;margin:6px 0"></div>
<hr style="margin:12px 0;border:0;border-top:1px solid var(--line)">
<div class="qtext">24 时计时法 ↔ 普通计时法：拖动滑块</div>
<div class="sl"><b id="lh"></b><input type="range" min="0" max="23" value="15" id="h24"></div><div class="big2" id="c24"></div>
<hr style="margin:12px 0;border:0;border-top:1px solid var(--line)">
<div class="qtext" id="qq"></div><div class="chs" id="ch"></div><div class="msg" id="mm"></div><div class="cc"><button class="btn ghost" id="nx">换一题</button></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('时间换算器');
var $=function(i){return document.getElementById(i)};

var Q,sc=0;
function draw(){var h=+$('h').value||0,m=+$('m').value||0,s=+$('s').value||0,sec=h*3600+m*60+s,mins=h*60+m;
  $('out').innerHTML='= <b>'+mins+'</b> 分 '+s+' 秒<br>= <b>'+sec+'</b> 秒<br>= '+Math.floor(sec/86400)+' 天 '+Math.floor(sec%86400/3600)+' 时 '+Math.floor(sec%3600/60)+' 分 '+sec%60+' 秒<br><span class="mut">1 时 = 60 分，1 分 = 60 秒；化成秒就是 '+h+'×3600 + '+m+'×60 + '+s+' = '+sec+'</span>'}
['h','m','s'].forEach(function(k){$(k).addEventListener('input',draw)});
function d24(){var H=+$('h24').value;$('lh').textContent=H+' 时';var p=H===0?'午夜 0 时 = 夜里 12 时':H<6?'凌晨 '+H+' 时':H<12?'上午 '+H+' 时':H===12?'中午 12 时':'下午 '+(H-12)+' 时（'+H+'-12）';$('c24').textContent=H+':00 = '+p}
$('h24').addEventListener('input',d24);
function newQ(){var t=Hub.rnd(0,2),a,right,txt,o;
  if(t===0){var h=Hub.rnd(1,5),m=Hub.rnd(1,59);a=h*60+m;txt=h+' 时 '+m+' 分 = ( ) 分';right=a;o=[a,h*10+m,h*100+m,a+60]}
  else if(t===1){var m2=Hub.rnd(2,9),s=Hub.rnd(1,59);a=m2*60+s;txt=m2+' 分 '+s+' 秒 = ( ) 秒';right=a;o=[a,m2*100+s,m2*10+s,a+60]}
  else{var H=Hub.rnd(13,23);txt='下午 '+(H-12)+' 时用 24 时计时法表示是 ( ) 时';right=H;o=[H,H-12,H+12>24?H-1:H+12,H+1]}
  Q={a:right};var seen={},oo=[];o.forEach(function(x){if(!seen[x]){seen[x]=1;oo.push(x)}});while(oo.length<4){var z=right+Hub.rnd(1,9)*5;if(!seen[z]){seen[z]=1;oo.push(z)}}oo.sort(function(){return Math.random()-.5});
  $('qq').textContent=txt;$('ch').innerHTML=oo.map(function(x){return '<button class="ch" data-c="'+x+'">'+x+'</button>'}).join('');$('mm').textContent=''}
$('ch').addEventListener('click',function(e){var c=e.target.dataset.c;if(c===undefined||!Q)return;var g=+c===Q.a;Hub.beep(g);if(g){sc++;Hub.star('time-convert',sc>=5?3:sc>=3?2:1)}$('mm').className='msg '+(g?'ok':'bad');$('mm').textContent=g?'✔ 对了（已对 '+sc+' 题）':'✘ 正确答案：'+Q.a;Q=null});
$('nx').onclick=newQ;draw();d24();newQ();
</script></body></html>
