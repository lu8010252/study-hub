<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>三角形内角和</title><link rel="stylesheet" href="/css/hub.css"></head>
<body><div class="page">
<div class="panel" style="text-align:center"><div style="font-size:22px;font-weight:700"><span style="color:#e5484d" id="a"></span> + <span style="color:#22a06b" id="b"></span> + <span style="color:#6366f1" id="c"></span> = <span class="big" id="sum"></span></div>
<div id="kind" style="color:var(--sub);min-height:26px"></div>
<svg id="s" viewBox="0 0 400 300" style="width:100%;max-width:560px;background:var(--bg);border-radius:16px"></svg>
<p style="color:var(--sub);margin:4px">拖动三个顶点，改变三角形的形状，看看三个角的和有没有变</p>
<div class="row" style="justify-content:center"><button class="btn ghost" data-p="acute">锐角三角形</button><button class="btn ghost" data-p="right">直角三角形</button><button class="btn ghost" data-p="obtuse">钝角三角形</button><button class="btn ghost" data-p="eq">等边三角形</button></div></div></div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('三角形内角和');
var $=function(i){return document.getElementById(i)};
var P=[[80,230],[320,230],[190,60]],svg=$('s'),drag=-1,COL=['#e5484d','#22a06b','#6366f1'];
function ang(i){var p=P[i],q=P[(i+1)%3],r=P[(i+2)%3],a1=Math.atan2(q[1]-p[1],q[0]-p[0]),a2=Math.atan2(r[1]-p[1],r[0]-p[0]),d=Math.abs(a1-a2);if(d>Math.PI)d=2*Math.PI-d;return d*180/Math.PI}
function draw(){
  var s='<polygon points="'+P.map(function(p){return p.join(',')}).join(' ')+'" fill="#6366f1" fill-opacity=".12" stroke="#6366f1" stroke-width="3"/>',i,v=[0,1,2].map(ang);
  for(i=0;i<3;i++){var p=P[i],q=P[(i+1)%3],r=P[(i+2)%3],a1=Math.atan2(q[1]-p[1],q[0]-p[0]),a2=Math.atan2(r[1]-p[1],r[0]-p[0]),R=34;
    var x1=p[0]+R*Math.cos(a1),y1=p[1]+R*Math.sin(a1),x2=p[0]+R*Math.cos(a2),y2=p[1]+R*Math.sin(a2),cross=(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]),sw=cross>0?1:0;
    s+='<path d="M'+x1+' '+y1+' A'+R+' '+R+' 0 0 '+sw+' '+x2+' '+y2+'" fill="none" stroke="'+COL[i]+'" stroke-width="4"/>';
    var mid=(a1+a2)/2;if(Math.abs(a1-a2)>Math.PI)mid+=Math.PI;
    s+='<text x="'+(p[0]+56*Math.cos(mid)-14)+'" y="'+(p[1]+56*Math.sin(mid)+5)+'" font-size="15" font-weight="800" fill="'+COL[i]+'">'+Math.round(v[i])+'°</text>';}
  for(i=0;i<3;i++)s+='<circle data-i="'+i+'" cx="'+P[i][0]+'" cy="'+P[i][1]+'" r="14" fill="'+COL[i]+'" stroke="#fff" stroke-width="3" style="cursor:grab"/>';
  svg.innerHTML=s;
  var r=v.map(Math.round);$('a').textContent=r[0]+'°';$('b').textContent=r[1]+'°';$('c').textContent=r[2]+'°';$('sum').textContent=(r[0]+r[1]+r[2])+'°';
  var mx=Math.max.apply(null,v);$('kind').textContent=Math.abs(mx-90)<1?'这是直角三角形':mx>90?'这是钝角三角形（有一个钝角）':'这是锐角三角形（三个角都小于 90°）';
  if(Math.abs(v[0]-60)<1.5&&Math.abs(v[1]-60)<1.5)$('kind').textContent='这是等边三角形（三个角都是 60°）';
}
function pt(e){var r=svg.getBoundingClientRect();return [(e.clientX-r.left)/r.width*400,(e.clientY-r.top)/r.height*300]}
svg.addEventListener('pointerdown',function(e){var t=e.target.dataset.i;if(t!==undefined){drag=+t;svg.setPointerCapture(e.pointerId)}});
svg.addEventListener('pointermove',function(e){if(drag<0)return;var p=pt(e);P[drag]=[Math.max(20,Math.min(380,p[0])),Math.max(20,Math.min(280,p[1]))];draw()});
function up(){drag=-1;Hub.star('triangle-sum',1)}svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
var PRE={acute:[[80,230],[320,230],[190,60]],right:[[90,240],[310,240],[90,80]],obtuse:[[60,230],[250,230],[330,100]],eq:[[80,240],[320,240],[200,240-120*Math.sqrt(3)]]};
document.querySelector('.row').onclick=function(e){var p=e.target.dataset.p;if(p){P=PRE[p].map(function(x){return x.slice()});draw()}};
draw();
</script></body></html>
