<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>除法的变化规律</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext">改一改被除数和除数，看商怎么变</div>
<div id="eq" class="big2" style="margin:10px 0"></div>
<div class="mut">被除数</div><div class="cc" id="ba"></div>
<div class="mut">除数</div><div class="cc" id="bb"></div>
<div class="mut">两个数同时</div><div class="cc" id="bc"></div>
<div id="log" style="text-align:left;max-width:460px;margin:10px auto;line-height:1.8"></div><div class="msg" id="m"></div>
<div class="cc"><button class="btn ghost" id="rs">复原</button></div></div>
<div class="panel"><b>规律：</b>被除数和除数<b>同时乘或除以相同的数（0 除外）</b>，商不变；被除数乘几，商就乘几；除数乘几，商就除以几。</div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('除法的变化规律');
var $=function(i){return document.getElementById(i)};

var A=240,B=40,log=[],last;
var OPS=[['×2',function(x){return x*2}],['×3',function(x){return x*3}],['×5',function(x){return x*5}],['÷2',function(x){return x/2}],['÷4',function(x){return x/4}],['÷5',function(x){return x/5}]];
function ok(f,x){var r=f(x);return r===Math.floor(r)&&r>=1&&r<=9999}
function draw(){var qq=A/B,g=function(id,w){$(id).innerHTML=OPS.map(function(o,i){var en=w==='c'?ok(o[1],A)&&ok(o[1],B):w==='a'?ok(o[1],A):ok(o[1],B);return '<button class="btn ghost" data-w="'+w+i+'" '+(en?'':'disabled style="opacity:.35"')+'>'+o[0]+'</button>'}).join('')};g('ba','a');g('bb','b');g('bc','c');
  $('eq').innerHTML=A+' ÷ '+B+' = <span style="color:#4f46e5">'+(Number.isInteger(qq)?qq:+qq.toFixed(3))+'</span>';
  $('log').innerHTML=log.slice(-5).map(function(l){return '<div>'+l+'</div>'}).join('')}
document.addEventListener('click',function(e){var w=e.target.dataset.w;if(!w)return;var k=w[0],o=OPS[+w.slice(1)],a0=A,b0=B,q0=A/B;if(k==='a'||k==='c')A=o[1](A);if(k==='b'||k==='c')B=o[1](B);var q1=A/B,txt=(k==='c'?'被除数、除数同时 '+o[0]:k==='a'?'被除数 '+o[0]:'除数 '+o[0]);
  var why=Math.abs(q1-q0)<1e-9?'商不变 ✔':(q1>q0?'商变大：× '+(+(q1/q0).toFixed(3)):'商变小：× '+(+(q1/q0).toFixed(3))+'（即 ÷ '+(+(q0/q1).toFixed(3))+'）');
  log.push(a0+' ÷ '+b0+' → '+A+' ÷ '+B+'　（'+txt+'）→ '+why);Hub.beep(true);
  if(k==='c'&&Math.abs(q1-q0)<1e-9){$('m').className='msg ok';$('m').textContent='发现了吗：同时乘（或除以）相同的数，商不变';Hub.star('div-const',log.length>=4?3:2)}else if(k!=='c'){$('m').className='msg';$('m').textContent=k==='a'?'被除数 '+o[0]+'，商也 '+o[0]:'除数 '+o[0]+'，商反过来变'}draw()});
$('rs').onclick=function(){A=240;B=40;log=[];$('m').textContent='';draw()};draw();
</script></body></html>
