<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>数量关系：总价与路程</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="cc"><button class="btn" data-m="p">单价·数量·总价</button><button class="btn ghost" data-m="d">速度·时间·路程</button></div>
<div id="stage"></div>
<div id="sl"></div><div id="eq" style="font-size:20px;line-height:1.8"></div>
<hr style="margin:12px 0;border:0;border-top:1px solid var(--line)">
<div class="qtext" id="qq"></div><div class="chs" id="ch"></div><div class="msg" id="m"></div><div class="cc"><button class="btn ghost" id="nx">换一题</button></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('数量关系：总价与路程');
var $=function(i){return document.getElementById(i)};

var mode='p',v={pr:6,n:5,sp:60,t:4},sc=0,Q,pos=0,anim=null;
function sl(k,lab,mn,mx,u){return '<div class="sl"><b>'+lab+' = '+v[k]+' '+u+'</b><input type="range" min="'+mn+'" max="'+mx+'" value="'+v[k]+'" data-k="'+k+'" data-l="'+lab+'" data-u="'+u+'"></div>'}
function draw(first){
  [].forEach.call(document.querySelectorAll('[data-m]'),function(x){x.classList.toggle('ghost',x.dataset.m!==mode)});
  if(mode==='p'){var h='',i;for(i=0;i<v.n;i++)h+='<span style="display:inline-block;margin:3px;padding:4px 8px;border-radius:10px;background:#fef3c7;border:2px solid #f59e0b;font-weight:700">🍎 '+v.pr+'元</span>';
    $('stage').innerHTML='<div style="min-height:70px">'+h+'</div>';
    if(first)$('sl').innerHTML=sl('pr','单价',1,20,'元')+sl('n','数量',1,12,'个');
    $('eq').innerHTML='总价 = 单价 × 数量 = '+v.pr+' × '+v.n+' = <b>'+v.pr*v.n+'</b> 元<br><span class="mut">单价 = 总价 ÷ 数量 = '+v.pr*v.n+' ÷ '+v.n+' = '+v.pr+'　　数量 = 总价 ÷ 单价 = '+v.pr*v.n+' ÷ '+v.pr+' = '+v.n+'</span>'}
  else{var D=v.sp*v.t;$('stage').innerHTML='<svg viewBox="0 0 360 90" style="width:100%;max-width:560px"><line x1="10" y1="62" x2="350" y2="62" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 6"/><text x="10" y="84" font-size="12" fill="#64748b">起点</text><text x="350" y="84" font-size="12" fill="#64748b" text-anchor="end">'+D+' 米</text><text id="car" x="'+(10+pos*300)+'" y="55" font-size="30">🚗</text></svg>';
    if(first)$('sl').innerHTML=sl('sp','速度',10,120,'米/分')+sl('t','时间',1,10,'分')+'<div class="cc"><button class="btn" id="go">▶ 出发</button></div>';
    $('eq').innerHTML='路程 = 速度 × 时间 = '+v.sp+' × '+v.t+' = <b>'+D+'</b> 米<br><span class="mut">速度 = 路程 ÷ 时间 = '+D+' ÷ '+v.t+' = '+v.sp+'　　时间 = 路程 ÷ 速度 = '+D+' ÷ '+v.sp+' = '+v.t+'</span>'}}
document.addEventListener('click',function(e){var m=e.target.dataset.m;if(m){mode=m;pos=0;$('sl').innerHTML='';draw(true);newQ()}
  if(e.target.id==='go'){var t0=Date.now(),dur=1200+v.t*300;pos=0;clearInterval(anim);anim=setInterval(function(){pos=Math.min(1,(Date.now()-t0)/dur);var c=$('car');if(c)c.setAttribute('x',10+pos*300);if(pos>=1)clearInterval(anim)},30)}});
document.addEventListener('input',function(e){var k=e.target.dataset.k;if(k){v[k]=+e.target.value;e.target.parentNode.firstChild.textContent=e.target.dataset.l+' = '+v[k]+' '+e.target.dataset.u;draw(false)}});
function newQ(){var a,b,u=Hub.rnd(0,2),names,units;
  if(mode==='p'){a=Hub.rnd(2,25);b=Hub.rnd(2,12);names=['单价','数量','总价'];units=['元','个','元'];var vals=[a,b,a*b];
    var ctx=['一支笔 '+a+' 元，买 '+b+' 支，一共多少元？','买 '+b+' 个书包共 '+a*b+' 元，每个书包多少元？','每本 '+a+' 元，'+a*b+' 元可以买几本？'];Q={q:ctx[u===0?0:u===1?2:1],a:u===0?a*b:u===1?b:a,u:u===0?'元':u===1?'本':'元'};
    if(u===1)Q.q='每本 '+a+' 元，'+a*b+' 元可以买几本？';}
  else{a=Hub.rnd(2,20)*5;b=Hub.rnd(2,9);var ctx2=['汽车每分钟行 '+a+' 米，行了 '+b+' 分，一共行了多少米？','小明 '+b+' 分钟走了 '+a*b+' 米，他每分钟走多少米？','每分钟行 '+a+' 米，行 '+a*b+' 米要多少分钟？'];Q={q:ctx2[u],a:u===0?a*b:u===1?a:b,u:u===0?'米':u===1?'米/分':'分'}}
  var o=[Q.a],d=[Q.a+1,Q.a*2,Math.max(1,Q.a-2),Q.a+10,Math.max(1,Math.round(Q.a/2))];d.forEach(function(x){if(o.indexOf(x)<0&&o.length<4)o.push(x)});o.sort(function(){return Math.random()-.5});
  $('qq').innerHTML=Q.q;$('ch').innerHTML=o.map(function(x){return '<button class="ch" data-c="'+x+'">'+x+' '+Q.u+'</button>'}).join('');$('m').textContent=''}
$('ch').addEventListener('click',function(e){var c=e.target.dataset.c;if(c===undefined||!Q)return;var good=+c===Q.a;Hub.beep(good);if(good){sc++;Hub.star('quantity-rel',sc>=5?3:sc>=3?2:1)}
  $('m').className='msg '+(good?'ok':'bad');$('m').textContent=good?'✔ 答对了（已对 '+sc+' 题）':'✘ 正确答案：'+Q.a+' '+Q.u;Q=null});
$('nx').onclick=newQ;draw(true);newQ();
</script></body></html>
