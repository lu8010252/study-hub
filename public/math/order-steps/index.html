<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>混合运算：点一点算一步</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext">先算哪一步？点一点<b>运算符号</b>，算出这一步的结果</div>
<div id="ex" style="font-size:34px;font-weight:800;min-height:60px;margin:10px 0;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center"></div>
<div class="msg" id="m"></div><div id="log" style="text-align:left;max-width:420px;margin:8px auto;font-size:18px;line-height:1.7"></div>
<div class="cc"><button class="btn ghost" id="nx">换一题</button></div></div>
<div class="panel"><b>运算顺序：</b>有括号先算括号里面的；只有加减或只有乘除，从左往右算；既有乘除又有加减，先算乘除，再算加减。</div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('混合运算：点一点算一步');
var $=function(i){return document.getElementById(i)};

var T,sc=0,log=[];
function gen(){var t=Hub.rnd(0,6),a,b,c,d;
  do{a=Hub.rnd(2,30);b=Hub.rnd(2,9);c=Hub.rnd(2,9);d=Hub.rnd(2,20);
    if(t===0)T=[a,'+',b,'×',c];
    else if(t===1)T=['(',a,'+',d,')','×',c];
    else if(t===2)T=[a*b,'÷',b,'+',c,'×',d];
    else if(t===3)T=[a+20,'-',b,'×',c];
    else if(t===4)T=[a*c,'÷','(',b,'+',c,')'].map(function(x){return x});
    else if(t===5)T=[a*b*c,'÷',b,'×',c];
    else T=[a+30,'-','(',b,'+',d,')','÷',c]}while(!valid(T));
  log=[];$('m').textContent='';render()}
function ev(a,o,b){return o==='+'?a+b:o==='-'?a-b:o==='×'?a*b:a/b}
function valid(t){try{var x=t.slice(),g=0;while(x.length>1){var i=valids(x)[0];if(i===undefined)return false;var a=x[i-1],o=x[i],b=x[i+1],r=ev(a,o,b);if(r<0||r!==Math.floor(r))return false;x.splice(i-1,3,r);x=unp(x)}return x[0]>0&&x[0]<400}catch(e){return false}}
function unp(x){for(var i=0;i<x.length-2;i++)if(x[i]==='('&&x[i+2]===')'&&typeof x[i+1]==='number'){x.splice(i,3,x[i+1]);i--}return x}
function isop(s){return s==='+'||s==='-'||s==='×'||s==='÷'}
function valids(x){/* 返回允许点击的运算符下标 */var res=[],i,hasP=x.indexOf('(')>=0;
  var groups=[];if(hasP){var o=x.indexOf('(');var c=x.indexOf(')');groups.push([o+1,c-1])}else groups.push([0,x.length-1]);
  groups.forEach(function(g){var ops=[];for(var k=g[0];k<=g[1];k++)if(isop(x[k]))ops.push(k);
    var md=ops.filter(function(k){return x[k]==='×'||x[k]==='÷'});
    if(md.length){md.forEach(function(k,ix){if(ix===0||md[ix-1]!==k-2)res.push(k)})}else if(ops.length)res.push(ops[0])});return res}
function render(){var h='',v=valids(T);T.forEach(function(s,i){if(isop(s))h+='<button data-i="'+i+'" style="min-width:48px;min-height:48px;border-radius:12px;border:2px solid #6366f1;background:#eef2ff;font-size:30px;font-weight:800;color:#4338ca">'+s+'</button>';else h+='<span>'+s+'</span>'});
  $('ex').innerHTML=h;$('log').innerHTML=log.map(function(l){return '<div>'+l+'</div>'}).join('')}
$('ex').addEventListener('click',function(e){var i=e.target.dataset.i;if(i===undefined)return;i=+i;var v=valids(T);
  if(v.indexOf(i)<0){var hasP=T.indexOf('(')>=0,why=hasP&&!(i>T.indexOf('(')&&i<T.indexOf(')'))?'有括号，要先算括号里面的':(T[i]==='+'||T[i]==='-')?'要先算乘除，再算加减':'同级运算要从左往右算';Hub.beep(false);$('m').className='msg bad';$('m').textContent='✘ 不能先算这一步：'+why;return}
  var a=T[i-1],o=T[i],b=T[i+1],r=ev(a,o,b);log.push(a+' '+o+' '+b+' = <b>'+r+'</b>');T.splice(i-1,3,r);T=unp(T);Hub.beep(true);$('m').textContent='';
  if(T.length===1){$('m').className='msg ok';$('m').textContent='✔ 结果是 '+T[0];sc++;Hub.star('order-steps',sc>=4?3:sc>=2?2:1)}render()});
$('nx').onclick=gen;gen();
</script></body></html>
