<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>凑十法与破十法</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="cc"><button class="btn" data-m="a">凑十法（进位加）</button><button class="btn ghost" data-m="s">破十法（退位减）</button></div>
<div class="qtext" id="q"></div>
<svg id="s" viewBox="0 0 340 120" style="width:100%;max-width:540px"></svg>
<div class="msg" id="m"></div><div class="mut" id="tip"></div>
<div class="cc"><button class="btn ghost" id="nx">换一题</button></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('凑十法与破十法');
var $=function(i){return document.getElementById(i)};

var mode='a',A,B,F1,F2,rm=0,sc=0,done=false;
function gen(){done=false;if(mode==='a'){A=Hub.rnd(6,9);B=Hub.rnd(11-A,9);F1=A;F2=B;$('q').innerHTML=A+' + '+B+' = ?　点右边盒子里的圆片，把它们<b>移到左边盒子</b>，先凑成 10';}
  else{A=Hub.rnd(11,18);B=Hub.rnd(A%10+1,9);F1=A;rm=0;$('q').innerHTML=A+' − '+B+' = ?　点圆片把它们<b>拿走</b>：先拿个位上的，不够就从 10 里拿';}$('m').textContent='';$('tip').textContent='';draw()}
function frame(x,cnt,col,ids){var s='',i;for(i=0;i<10;i++){var cx=x+(i%5)*32,cy=10+Math.floor(i/5)*44;s+='<rect x="'+cx+'" y="'+cy+'" width="30" height="40" rx="5" fill="#fff" stroke="#c7d2fe"/>';if(i<cnt)s+='<circle data-f="'+ids+'" data-i="'+i+'" cx="'+(cx+15)+'" cy="'+(cy+20)+'" r="12" fill="'+col+'" style="cursor:pointer"/>'}return s}
function draw(){var s='';
  if(mode==='a'){s=frame(10,F1,'#6366f1','1')+frame(190,F2,'#f59e0b','2')+'<text x="85" y="108" text-anchor="middle" font-size="13" fill="#64748b">'+F1+' 个</text><text x="265" y="108" text-anchor="middle" font-size="13" fill="#64748b">'+F2+' 个</text>';
    if(F1===10&&!done){done=true;sc++;Hub.beep(true);Hub.star('ten-frame-add',sc>=4?3:sc>=2?2:1);$('m').className='msg ok';$('m').textContent='✔ 凑成 10 了！10 + '+F2+' = '+(10+F2);$('tip').textContent=A+' + '+B+' = 10 + '+F2+' = '+(A+B)+'（把 '+B+' 分成 '+(10-A)+' 和 '+F2+'）'}}
  else{var tens=A>=10?1:0,ones=A-10*tens-rm>=0?A-10*tens:A,left=A-rm;var tenCnt=Math.min(10,Math.max(0,left-(A-10))),onesCnt=Math.max(0,Math.min(A-10,left));
    /* 十位框装 10 个，个位框装 A-10 个；拿走时先从个位拿，个位空了再从十位拿 */
    var oc=Math.max(0,(A-10)-rm),tc=10-Math.max(0,rm-(A-10));s=frame(10,tc,'#6366f1','t')+frame(190,oc,'#f59e0b','o')+'<text x="85" y="108" text-anchor="middle" font-size="13" fill="#64748b">一个十</text><text x="265" y="108" text-anchor="middle" font-size="13" fill="#64748b">个位</text>';
    if(rm===B&&!done){done=true;sc++;Hub.beep(true);Hub.star('ten-frame-add',sc>=4?3:sc>=2?2:1);$('m').className='msg ok';$('m').textContent='✔ '+A+' − '+B+' = '+(A-B);$('tip').textContent=A+' − '+B+'：先减个位 '+(A-10)+'，再从 10 里减 '+(B-(A-10))+'，10 − '+(B-(A-10))+' = '+(10-(B-(A-10)))+'，再加上 0 个个位 → '+(A-B)}}
  $('s').innerHTML=s}
$('s').addEventListener('pointerdown',function(e){var f=e.target.dataset.f;if(!f||done)return;
  if(mode==='a'){if(f==='2'&&F1<10){F2--;F1++;draw()}}else{if(rm<B){rm++;draw()}}});
document.addEventListener('click',function(e){var m=e.target.dataset.m;if(m){mode=m;[].forEach.call(document.querySelectorAll('[data-m]'),function(x){x.classList.toggle('ghost',x.dataset.m!==m)});gen()}});
$('nx').onclick=gen;gen();
</script></body></html>
