<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>小数点移动</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext">输入一个小数，看小数点移动后大小怎么变</div>
<input id="in" inputmode="decimal" value="3.5" maxlength="9" style="font-size:26px;text-align:center;width:200px;border:2px solid var(--line);border-radius:12px;padding:8px">
<div class="cc"><button class="btn" data-s="1">× 10</button><button class="btn" data-s="2">× 100</button><button class="btn" data-s="3">× 1000</button><button class="btn ghost" data-s="-1">÷ 10</button><button class="btn ghost" data-s="-2">÷ 100</button><button class="btn ghost" data-s="-3">÷ 1000</button></div>
<div id="out" class="big2" style="min-height:70px"></div><div id="tip" class="mut"></div>
<hr style="margin:12px 0;border:0;border-top:1px solid var(--line)">
<div class="qtext" id="qq"></div><div class="chs" id="ch"></div><div class="msg" id="m"></div><div class="cc"><button class="btn ghost" id="nx">换一题</button></div></div>
<div class="panel"><b>规律：</b>一个数乘 10、100、1000……，小数点向<b>右</b>移动 1、2、3……位；除以 10、100、1000……，小数点向<b>左</b>移动 1、2、3……位（位数不够用 0 补）。</div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('小数点移动');
var $=function(i){return document.getElementById(i)};

var sc=0,Q;
function shift(str,k){var neg=false,p=str.split('.'),a=p[0]||'0',b=p[1]||'';if(k>0){while(b.length<k)b+='0';a+=b.slice(0,k);b=b.slice(k)}else{k=-k;while(a.length<k)a='0'+a;b=a.slice(a.length-k)+b;a=a.slice(0,a.length-k)||'0'}
  a=a.replace(/^0+(?=\d)/,'');b=b.replace(/0+$/,'');return b?a+'.'+b:a}
function show(base,res,k){var h='<span style="color:#64748b;font-size:18px">'+base+'</span> <span style="font-size:18px">'+(k>0?'→ 小数点向右移 '+k+' 位 → ':'→ 小数点向左移 '+(-k)+' 位 → ')+'</span> <span style="color:#4f46e5">'+res+'</span>';return h}
document.addEventListener('click',function(e){var s=e.target.dataset.s;if(s){var v=$('in').value.replace(/[^0-9.]/g,'');if(!/^\d*\.?\d*$/.test(v)||!v||v==='.'){$('out').textContent='请输入一个数';return}k=+s;
  $('out').innerHTML=show(v,shift(v,k),k);$('tip').textContent=(k>0?'乘 ':'除以 ')+'1'+'0'.repeat(Math.abs(k))+'：小数点向'+(k>0?'右':'左')+'移动 '+Math.abs(k)+' 位'}});
var k=0;
function newQ(){var d=Hub.rnd(1,3),dec=Hub.rnd(0,2),base=String(Hub.rnd(1,999)/Math.pow(10,dec));if(dec)base=(Hub.rnd(1,999)/Math.pow(10,dec)).toFixed(dec).replace(/0+$/,'').replace(/\.$/,'');if(!base||+base===0)base='4.5';
  var up=Math.random()<.5,kk=up?d:-d,ans=shift(base,kk);Q={a:ans};var set=[ans,shift(base,-kk),shift(base,kk>0?kk+1:kk-1),shift(base,kk>0?kk-1||1:kk+1||-1)];var o=[];set.forEach(function(x){if(o.indexOf(x)<0)o.push(x)});
  while(o.length<4){var z=shift(base,Hub.rnd(-3,3)||2);if(o.indexOf(z)<0)o.push(z)}o=o.slice(0,4);if(o.indexOf(ans)<0)o[0]=ans;o.sort(function(){return Math.random()-.5});
  $('qq').innerHTML=base+(up?' × ':' ÷ ')+'1'+'0'.repeat(d)+' = ?';$('ch').innerHTML=o.map(function(x){return '<button class="ch" data-c="'+x+'">'+x+'</button>'}).join('');$('m').textContent=''}
$('ch').addEventListener('click',function(e){var c=e.target.dataset.c;if(c===undefined||!Q)return;var good=c===Q.a;Hub.beep(good);if(good){sc++;Hub.star('decimal-shift',sc>=5?3:sc>=3?2:1)}
  $('m').className='msg '+(good?'ok':'bad');$('m').textContent=good?'✔ 答对了（已对 '+sc+' 题）':'✘ 正确答案：'+Q.a;Q=null});
$('nx').onclick=newQ;$('out').innerHTML=show('3.5',shift('3.5',1),1);newQ();
</script></body></html>
