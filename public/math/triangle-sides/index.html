<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>三角形的三边关系</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext">拖动滑块改变三根小棒的长度，看能不能围成三角形</div>
<svg id="s" viewBox="0 0 360 220" style="width:100%;max-width:520px"></svg>
<div id="sl"></div><div id="rel" class="big2"></div><div class="mut" id="tip"></div>
<hr style="margin:14px 0;border:0;border-top:1px solid var(--line)">
<div class="qtext" id="qq"></div><div class="chs" id="ch"></div><div class="msg" id="m"></div>
<div class="cc"><button class="btn" id="nx">出一道判断题</button></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('三角形的三边关系');
var $=function(i){return document.getElementById(i)};

var L={a:3,b:4,c:5},sc=0,Q=null;
function sl(k){return '<div class="sl"><b>'+k+' = '+L[k]+' 厘米</b><input type="range" min="1" max="12" value="'+L[k]+'" data-k="'+k+'"></div>'}
function can(a,b,c){return a+b>c&&a+c>b&&b+c>a}
function draw(){var a=L.a,b=L.b,c=L.c,s='',ok=can(a,b,c),k=18;
  if(ok){var x=(c*c+a*a-b*b)/(2*c),y=Math.sqrt(Math.max(0,a*a-x*x)),ox=180-c*k/2,oy=190;
    s='<polygon points="'+ox+','+oy+' '+(ox+c*k)+','+oy+' '+(ox+x*k)+','+(oy-y*k)+'" fill="rgba(99,102,241,.25)" stroke="#4338ca" stroke-width="3" stroke-linejoin="round"/>'+
    '<text x="'+(ox+c*k/2)+'" y="'+(oy+16)+'" text-anchor="middle" fill="#334155">c='+c+'</text>'}
  else{var y0=40,tot=a+b+c;s='';var items=[['a',a,'#6366f1'],['b',b,'#f59e0b'],['c',c,'#22a06b']];items.forEach(function(it,i){s+='<rect x="20" y="'+(30+i*38)+'" width="'+it[1]*k+'" height="16" rx="4" fill="'+it[2]+'"/><text x="'+(26+it[1]*k)+'" y="'+(43+i*38)+'" fill="#334155">'+it[0]+'='+it[1]+'</text>'});
    s+='<text x="180" y="170" text-anchor="middle" font-size="18" fill="#e5484d" font-weight="700">两根短的接起来也够不着最长的</text>'}
  $('s').innerHTML=s;
  $('rel').innerHTML=[[a,b,c,'a+b','c'],[a,c,b,'a+c','b'],[b,c,a,'b+c','a']].map(function(r){var g=r[0]+r[1]>r[2];return '<div style="font-size:18px;color:'+(g?'#22a06b':'#e5484d')+'">'+r[3]+' = '+(r[0]+r[1])+(g?' > ':' ≤ ')+r[4]+' = '+r[2]+(g?' ✓':' ✗')+'</div>'}).join('');
  $('tip').textContent=ok?'能围成三角形：任意两边的和都大于第三边':'不能围成：有两边的和不大于第三边'}
$('sl').innerHTML=sl('a')+sl('b')+sl('c');
document.addEventListener('input',function(e){var k=e.target.dataset.k;if(k){L[k]=+e.target.value;e.target.parentNode.firstChild.textContent=k+' = '+L[k]+' 厘米';draw()}});
function newQ(){var a,b,c;do{a=Hub.rnd(2,12);b=Hub.rnd(2,12);c=Hub.rnd(2,12)}while(Math.random()<.5?!can(a,b,c):can(a,b,c));Q={a:a,b:b,c:c,r:can(a,b,c)};
  $('qq').innerHTML='三根小棒长 <b>'+a+'、'+b+'、'+c+'</b> 厘米，能围成三角形吗？';$('ch').innerHTML='<button class="ch" data-c="1">能</button><button class="ch" data-c="0">不能</button>';$('m').textContent=''}
$('ch').addEventListener('click',function(e){var c=e.target.dataset.c;if(c===undefined||!Q)return;var good=(c==='1')===Q.r;Hub.beep(good);
  if(good){sc++;Hub.star('triangle-sides',sc>=5?3:sc>=3?2:1)}
  var m=[Q.a,Q.b,Q.c].sort(function(x,y){return x-y});
  $('m').className='msg '+(good?'ok':'bad');$('m').textContent=(good?'✔ 对！':'✘ 不对。')+'最短两根 '+m[0]+'+'+m[1]+'='+(m[0]+m[1])+(m[0]+m[1]>m[2]?' > ':' ≤ ')+m[2]+(Q.r?'，能围成':'，不能围成')+'（已答对 '+sc+' 题）';Q=null});
$('nx').onclick=newQ;draw();newQ();
</script></body></html>
