<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>圆的探索</title><link rel="stylesheet" href="/css/hub.css"></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<svg id="s" viewBox="0 0 600 360" style="width:100%;max-width:720px"></svg>
<div style="text-align:left">半径 r = <b id="rv"></b> 厘米<input class="range" id="r" type="range" min="1" max="8" step="0.5" value="3"></div>
<div class="row" style="justify-content:center;gap:24px"><div>直径 d = <b id="d"></b></div><div>周长 C = <b id="c" class="big"></b></div><div>面积 S = <b id="a" class="big"></b></div></div>
<p style="color:var(--sub)" id="note"></p>
<div class="row" style="justify-content:center"><button class="btn" id="roll">▶ 把圆“滚”开，量一量周长</button></div></div></div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('圆的探索');
var $=function(i){return document.getElementById(i)};
var r=3,t=0,anim=null,svg=$('s'),PI=3.14,K=24;
function draw(){
  var R=r*K,cx=30+R,cy=150,s='';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="#a5b4fc" fill-opacity=".35" stroke="#6366f1" stroke-width="3"/>';
  s+='<line x1="'+(cx-R)+'" y1="'+cy+'" x2="'+(cx+R)+'" y2="'+cy+'" stroke="#e5484d" stroke-width="3"/><text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" font-size="14" fill="#e5484d">d</text>';
  s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+cx+'" y2="'+(cy-R)+'" stroke="#22a06b" stroke-width="3"/>';
  var C=2*PI*R,rx=30+2*R+20,len=C*t;
  s+='<line x1="'+rx+'" y1="320" x2="'+(rx+Math.min(len,560-rx))+'" y2="320" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>';
  s+='<text x="20" y="345" font-size="14" fill="currentColor">周长展开：C ≈ '+(C/K).toFixed(2)+' 厘米，是直径 d 的 '+PI+' 倍</text>';
  /* 直径尺子 */
  for(var i=0;i<3;i++){var x0=30+2*R+20+i*2*R;if(x0+2*R<=560&&len>=C*(i+1)/3*0+0){s+='<rect x="'+x0+'" y="296" width="'+2*R+'" height="12" fill="#e5484d" fill-opacity="'+(len>(i+1)*2*R?.7:.2)+'" stroke="#fff"/>'}}
  svg.innerHTML=s;
  $('rv').textContent=r;$('d').textContent=(2*r)+' 厘米';$('c').textContent=(2*PI*r).toFixed(2)+' 厘米';$('a').textContent=(PI*r*r).toFixed(2)+' 平方厘米';
  $('note').textContent='C = πd = 3.14 × '+2*r+' = '+(2*PI*r).toFixed(2)+'；S = πr² = 3.14 × '+r+' × '+r+' = '+(PI*r*r).toFixed(2);
}
$('r').oninput=function(){r=+this.value;t=0;draw()};
$('roll').onclick=function(){if(anim)cancelAnimationFrame(anim);t=0;var t0=performance.now();(function f(n){t=Math.min(1,(n-t0)/1800);draw();if(t<1)anim=requestAnimationFrame(f);else Hub.star('circle-explore',2)})(t0)};
draw();
</script></body></html>
