<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>数一数：体积和体积单位</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="cc"><button class="btn" data-m="b">长方体的体积</button><button class="btn ghost" data-m="u">1 立方分米 = 1000 立方厘米</button></div>
<svg id="s" viewBox="-200 -250 400 300" style="width:100%;max-width:560px"></svg>
<div id="ctl"></div><div id="out" style="font-size:19px;line-height:1.9"></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('数一数：体积和体积单位');
var $=function(i){return document.getElementById(i)};

var mode='b',D={a:5,b:3,c:2},step=0;
function P(x,y,z,A,B,H){return [(x-y)*A,-(x+y)*B-z*H]}
function poly(p,f,st){return '<polygon points="'+p.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ')+'" fill="'+f+'" stroke="'+(st||'#334155')+'" stroke-width=".7" stroke-linejoin="round"/>'}
function boxes(a,b,c,hi){var m=Math.max(a,b,c),u=Math.min(26,200/m/1.6),A=u*.87,B=u*.5,H=u,s='',cells=[],x,y,z;for(x=0;x<a;x++)for(y=0;y<b;y++)for(z=0;z<c;z++)cells.push([x,y,z]);cells.sort(function(p,q){return (q[0]+q[1])-(p[0]+p[1])||p[2]-q[2]});
  var col=['#fde68a','#f59e0b','#d97706'];cells.forEach(function(q){var x=q[0],y=q[1],z=q[2],on=hi===undefined||z<hi,t=on?['#fde68a','#fbbf24','#d97706']:['#c7d2fe','#a5b4fc','#818cf8'];
    s+=poly([P(x,y,z+1,A,B,H),P(x+1,y,z+1,A,B,H),P(x+1,y+1,z+1,A,B,H),P(x,y+1,z+1,A,B,H)],t[0])+poly([P(x,y,z,A,B,H),P(x+1,y,z,A,B,H),P(x+1,y,z+1,A,B,H),P(x,y,z+1,A,B,H)],t[1])+poly([P(x,y,z,A,B,H),P(x,y+1,z,A,B,H),P(x,y+1,z+1,A,B,H),P(x,y,z+1,A,B,H)],t[2])});return s}
function draw(){[].forEach.call(document.querySelectorAll('[data-m]'),function(x){x.classList.toggle('ghost',x.dataset.m!==mode)});
  if(mode==='b'){var a=D.a,b=D.b,c=D.c;$('s').innerHTML=boxes(a,b,c);
    if(!draw.k)$('ctl').innerHTML=['a','b','c'].map(function(k,i){return '<div class="sl"><b>'+['长','宽','高'][i]+' <span id="v'+k+'">'+D[k]+'</span></b><input type="range" min="1" max="10" value="'+D[k]+'" data-k="'+k+'"></div>'}).join('')+'<div class="sl"><b>数到第几层</b><input type="range" min="1" max="10" value="'+D.c+'" id="ly"></div>';draw.k=1;
    $('out').innerHTML='每层：'+a+' × '+b+' = <b>'+a*b+'</b> 个小正方体（底面积）<br>一共 '+c+' 层：'+a*b+' × '+c+' = <b style="color:#4f46e5">'+a*b*c+'</b> 个<br>每个小正方体体积是 1 立方厘米 → 体积 = 长 × 宽 × 高 = <b>'+a*b*c+'</b> 立方厘米'}
  else{draw.k=0;var info=[['1 个小正方体','棱长 1 厘米，体积是 1 立方厘米',1,1,1],['10 个排成一行','长 10 厘米 = 1 分米',10,1,1],['10 行排成一层','一层有 10 × 10 = 100 个',10,10,1],['10 层叠起来','10 × 10 × 10 = 1000 个，棱长是 10 厘米 = 1 分米',10,10,10]],i=info[step];$('s').innerHTML=boxes(i[2],i[3],i[4]);
    $('ctl').innerHTML='<div class="cc"><button class="btn ghost" data-st="-1">⬅ 上一步</button><button class="btn" data-st="1">下一步 ➡</button></div>';$('out').innerHTML='<b>'+i[0]+'</b>：'+i[1]+(step===3?'<br><b style="color:#e5484d">1 立方分米 = 1000 立方厘米</b>；同样 1 立方米 = 1000 立方分米':'');if(step===3)Hub.star('volume-units',3)}
  if(mode==='b'&&D.a*D.b*D.c>=100)Hub.star('volume-units',2)}
document.addEventListener('input',function(e){var k=e.target.dataset.k;if(k){D[k]=+e.target.value;$('v'+k).textContent=D[k];draw()}if(e.target.id==='ly'){var h=+e.target.value;$('s').innerHTML=boxes(D.a,D.b,D.c,h);$('out').innerHTML='数到第 '+h+' 层：'+D.a*D.b+' × '+h+' = <b>'+D.a*D.b*h+'</b> 个（蓝色的是还没数到的）'}});
document.addEventListener('click',function(e){var m=e.target.dataset.m,st=e.target.dataset.st;if(m){mode=m;draw.k=0;step=0;draw()}if(st){step=Math.max(0,Math.min(3,step+ +st));draw()}});draw();
</script></body></html>
