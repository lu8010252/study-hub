<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>平行四边形和梯形</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="cc"><button class="btn" data-m="p">平行四边形</button><button class="btn ghost" data-m="t">梯形</button></div>
<div class="qtext" id="task"></div>
<svg id="s" viewBox="0 0 400 240" style="width:100%;max-width:560px;background:#fff;border-radius:10px"></svg>
<div id="info" style="margin-top:8px;font-size:18px;line-height:1.7"></div></div>
<div class="panel"><b>小知识：</b>两组对边分别平行的四边形叫<b>平行四边形</b>，它容易变形（不稳定）；只有一组对边平行的四边形叫<b>梯形</b>。从一条边上一点向对边作垂线，这点和垂足之间的线段叫做<b>高</b>。</div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('平行四边形和梯形');
var $=function(i){return document.getElementById(i)};

var mode='p',th=70,top=120,drag=false;
function draw(){var s='',info='',bx=100,by=200,B=200;
  if(mode==='p'){var L=110,h=Math.sin(th*Math.PI/180)*L,off=Math.cos(th*Math.PI/180)*L;var A=[bx,by],Bp=[bx+B,by],C=[bx+B+off,by-h],D=[bx+off,by-h];
    s+='<polygon points="'+[A,Bp,C,D].map(function(p){return p.join(',')}).join(' ')+'" fill="rgba(99,102,241,.2)" stroke="#4338ca" stroke-width="3" stroke-linejoin="round"/>';
    s+='<line x1="'+D[0]+'" y1="'+D[1]+'" x2="'+D[0]+'" y2="'+by+'" stroke="#e5484d" stroke-width="2.5" stroke-dasharray="6 4"/><text x="'+(D[0]+6)+'" y="'+(by-h/2)+'" fill="#e5484d" font-weight="700">高</text>';
    s+='<rect x="'+(D[0]-(off<0?0:12))+'" y="'+(by-12)+'" width="12" height="12" fill="none" stroke="#e5484d"/>';
    s+='<circle id="hd" cx="'+D[0]+'" cy="'+D[1]+'" r="15" fill="#f59e0b" stroke="#fff" stroke-width="3" style="cursor:grab"/>';
    var ang=Math.round(th);info='底 = 20 厘米，邻边 = 11 厘米<br>高 = '+(h/10).toFixed(1)+' 厘米　面积 = 底 × 高 = '+(20*h/10).toFixed(1)+' 平方厘米<br>相邻两个角：'+ang+'° + '+(180-ang)+'° = 180°（对角相等）<br><span class="mut">拖动橙色点：边的长度不变，形状和面积都变了 —— 平行四边形容易变形</span>';$('task').textContent='拖动橙色点，看平行四边形怎样变化'}
  else{var w=top,H=110,B2=240,x0=80,x1=x0+(B2-w)/2;var A2=[x0,by],B3=[x0+B2,by],C2=[x1+w,by-H],D2=[x1,by-H];
    s+='<polygon points="'+[A2,B3,C2,D2].map(function(p){return p.join(',')}).join(' ')+'" fill="rgba(34,160,107,.2)" stroke="#15803d" stroke-width="3" stroke-linejoin="round"/>';
    s+='<text x="'+((D2[0]+C2[0])/2)+'" y="'+(D2[1]-8)+'" text-anchor="middle" fill="#15803d" font-weight="700">上底 '+(w/10).toFixed(0)+' 厘米</text><text x="'+((A2[0]+B3[0])/2)+'" y="'+(by+20)+'" text-anchor="middle" fill="#15803d" font-weight="700">下底 24 厘米</text>';
    s+='<line x1="'+D2[0]+'" y1="'+D2[1]+'" x2="'+D2[0]+'" y2="'+by+'" stroke="#e5484d" stroke-width="2.5" stroke-dasharray="6 4"/><text x="'+(D2[0]+6)+'" y="'+(by-H/2)+'" fill="#e5484d" font-weight="700">高 11</text>';
    s+='<circle id="hd" cx="'+C2[0]+'" cy="'+C2[1]+'" r="15" fill="#f59e0b" stroke="#fff" stroke-width="3" style="cursor:grab"/>';
    var area=(w/10+24)*11/2;info='梯形面积 = (上底 + 下底) × 高 ÷ 2<br>= ('+(w/10).toFixed(0)+' + 24) × 11 ÷ 2 = '+area+' 平方厘米<br><span class="mut">拖动橙色点改变上底；上底和下底始终平行（只有一组对边平行）。上底 = 下底时就成了平行四边形。</span>';$('task').textContent='拖动橙色点改变上底的长度'}
  $('s').innerHTML=s;$('info').innerHTML=info}
function pt(e){var r=$('s').getBoundingClientRect();return [(e.clientX-r.left)/r.width*400,(e.clientY-r.top)/r.height*240]}
$('s').addEventListener('pointerdown',function(e){if(e.target.id==='hd'){drag=true;$('s').setPointerCapture(e.pointerId)}});
$('s').addEventListener('pointermove',function(e){if(!drag)return;var q=pt(e);
  if(mode==='p'){var dx=q[0]-100,dy=200-q[1],a=Math.atan2(dy,dx)*180/Math.PI;th=Math.max(30,Math.min(150,a))}
  else{top=Math.max(40,Math.min(240,(q[0]-80)*2-240+ (240-0)*0+ 0))}draw()});
['pointerup','pointercancel'].forEach(function(n){$('s').addEventListener(n,function(){drag=false})});
document.addEventListener('click',function(e){var m=e.target.dataset.m;if(m){mode=m;[].forEach.call(document.querySelectorAll('[data-m]'),function(x){x.classList.toggle('ghost',x.dataset.m!==m)});draw()}});
draw();
</script></body></html>
