<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>多边形的内角和</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="sl"><b id="nl"></b><input type="range" min="3" max="10" value="5" id="n"></div>
<div class="cc"><button class="btn ghost" id="dg">显示分成的三角形</button><button class="btn ghost" id="rs">复原</button></div>
<svg id="s" viewBox="0 0 360 300" style="width:100%;max-width:560px;background:#fff;border-radius:10px"></svg>
<div id="info" style="font-size:19px;line-height:1.8"></div></div>
<div class="panel"><b>规律：</b>从多边形一个顶点出发，可以画出 (边数 − 3) 条对角线，把它分成 (边数 − 2) 个三角形。每个三角形内角和是 180°，所以 n 边形的内角和是 <b>(n − 2) × 180°</b>。拖动顶点，形状变了，内角和不变！</div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('多边形的内角和');
var $=function(i){return document.getElementById(i)};

var n=5,P=[],dg=false,drag=-1;
function reset(){P=[];for(var i=0;i<n;i++){var a=-Math.PI/2+i*2*Math.PI/n;P.push([180+120*Math.cos(a),150+120*Math.sin(a)])}}
function angles(){var A=0,i,m=P.length;for(i=0;i<m;i++){var q=P[i],r=P[(i+1)%m];A+=q[0]*r[1]-r[0]*q[1]}var sg=A>0?1:-1,res=[];
  for(i=0;i<m;i++){var p0=P[(i+m-1)%m],p1=P[i],p2=P[(i+1)%m],ax=p1[0]-p0[0],ay=p1[1]-p0[1],bx=p2[0]-p1[0],by=p2[1]-p1[1],t=Math.atan2(ax*by-ay*bx,ax*bx+ay*by)*180/Math.PI*sg;res.push(180-t)}return res}
function draw(){var s='',m=P.length,i,ag=angles(),sum=0;
  s+='<polygon points="'+P.map(function(p){return p.join(',')}).join(' ')+'" fill="rgba(99,102,241,.15)" stroke="#4338ca" stroke-width="3" stroke-linejoin="round"/>';
  if(dg)for(i=2;i<m-1;i++)s+='<line x1="'+P[0][0]+'" y1="'+P[0][1]+'" x2="'+P[i][0]+'" y2="'+P[i][1]+'" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 4"/>';
  for(i=0;i<m;i++){sum+=ag[i];var cx=0,cy=0;P.forEach(function(p){cx+=p[0]/m;cy+=p[1]/m});var dx=P[i][0]-cx,dy=P[i][1]-cy,l=Math.hypot(dx,dy)||1;
    s+='<circle data-i="'+i+'" cx="'+P[i][0]+'" cy="'+P[i][1]+'" r="13" fill="#f59e0b" stroke="#fff" stroke-width="3" style="cursor:grab"/><text x="'+(P[i][0]+dx/l*30)+'" y="'+(P[i][1]+dy/l*30+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#334155" pointer-events="none">'+Math.round(ag[i])+'°</text>'}
  $('s').innerHTML=s;$('nl').textContent=n+' 边形';
  $('info').innerHTML='内角和 = '+ag.map(function(a){return Math.round(a)}).join(' + ')+' = <b>'+Math.round(sum)+'°</b><br>(n − 2) × 180° = ('+n+' − 2) × 180° = <b>'+(n-2)*180+'°</b>，分成 '+(n-2)+' 个三角形'}
function pt(e){var r=$('s').getBoundingClientRect();return [(e.clientX-r.left)/r.width*360,(e.clientY-r.top)/r.height*300]}
$('s').addEventListener('pointerdown',function(e){var i=e.target.dataset.i;if(i!==undefined){drag=+i;$('s').setPointerCapture(e.pointerId)}});
$('s').addEventListener('pointermove',function(e){if(drag<0)return;var q=pt(e);P[drag]=[Math.max(10,Math.min(350,q[0])),Math.max(10,Math.min(290,q[1]))];draw()});
['pointerup','pointercancel'].forEach(function(k){$('s').addEventListener(k,function(){drag=-1})});
$('n').addEventListener('input',function(e){n=+e.target.value;reset();draw();if(n>=8)Hub.star('polygon-sum',2);if(n===10)Hub.star('polygon-sum',3)});
$('dg').onclick=function(){dg=!dg;$('dg').classList.toggle('ghost',!dg);draw();Hub.star('polygon-sum',1)};$('rs').onclick=function(){reset();draw()};reset();draw();
</script></body></html>
