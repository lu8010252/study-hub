<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>计数器</title><link rel="stylesheet" href="/css/hub.css">
<style>.cols{display:flex;justify-content:center;gap:12px}.col{width:min(20vw,92px);text-align:center}.col h4{margin:0 0 4px;color:var(--p1)}
.rod{position:relative;height:250px;border-radius:12px;background:var(--bg);border:2px solid var(--line);display:flex;flex-direction:column-reverse;align-items:center;padding:6px 0;gap:3px}
.rod:before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:6px;margin-left:-3px;background:#a5b4fc;border-radius:3px}
.bead{position:relative;width:70%;height:20px;border-radius:10px;background:linear-gradient(#818cf8,#6366f1);box-shadow:0 2px 0 #4f46e5}
.col button{margin-top:6px;width:100%;min-height:44px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:24px;font-weight:800;touch-action:manipulation}</style></head>
<body><div class="page">
<div class="panel" style="text-align:center"><div class="big" id="num"></div><div id="rd" style="color:var(--sub);min-height:28px;margin-bottom:8px"></div><div class="cols" id="cols"></div>
<p style="color:var(--sub)">每个数位用 ＋ 加一颗珠子，满十就要进一（会自动进位），点 － 减一颗</p></div>
<div class="panel" style="text-align:center"><div id="task" style="font-weight:700;font-size:20px"></div>
 <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="chk">检查</button><button class="btn ghost" id="nx">换一题</button><button class="btn ghost" id="cl">清零</button></div><div class="msg" id="m"></div></div></div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('计数器');
var $=function(i){return document.getElementById(i)};
var NM=['个位','十位','百位','千位'],d=[0,0,0,0],goal=0,solved=0,CNU='零一二三四五六七八九';
function val(){return d[3]*1000+d[2]*100+d[1]*10+d[0]}
function read(n){if(n===0)return '零';var s='',u=['','十','百','千'],ds=String(n).split('').map(Number),L=ds.length,z=false;ds.forEach(function(x,i){var p=L-1-i;if(x===0){z=true}else{if(z&&s)s+='零';z=false;s+=(L===2&&p===1&&x===1?'':CNU[x])+u[p]}});return s}
function draw(){
  $('cols').innerHTML=[3,2,1,0].map(function(i){var b='';for(var k=0;k<d[i];k++)b+='<div class="bead"></div>';return '<div class="col"><h4>'+NM[i]+'</h4><div class="rod">'+b+'</div><button data-i="'+i+'" data-v="1">＋</button><button data-i="'+i+'" data-v="-1">－</button></div>'}).join('');
  $('num').textContent=val();$('rd').textContent='读作：'+read(val());
}
$('cols').onclick=function(e){var b=e.target.closest('button');if(!b)return;var i=+b.dataset.i,v=+b.dataset.v;
  if(v>0){if(d[i]<9)d[i]++;else if(i<3){d[i]=0;d[i+1]=Math.min(9,d[i+1]+1)}}else if(d[i]>0)d[i]--;draw()};
function pick(){goal=Hub.rnd(1,9999);if(Hub.rnd(0,2)===0)goal=Math.floor(goal/100)*100+Hub.rnd(0,1)*5;$('task').textContent='拨出 '+goal+'（'+read(goal)+'）';$('m').textContent=''}
$('chk').onclick=function(){if(val()===goal){solved++;$('m').className='msg ok';$('m').textContent='✔ 对了！已完成 '+solved+' 题';Hub.beep(true);Hub.star('abacus',solved>=5?3:solved>=3?2:1)}else{$('m').className='msg bad';$('m').textContent='现在是 '+val()+'，再拨一拨';Hub.beep(false)}};
$('nx').onclick=function(){pick()};$('cl').onclick=function(){d=[0,0,0,0];draw()};
pick();draw();
</script></body></html>
