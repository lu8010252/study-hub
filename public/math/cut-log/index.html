<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>锯木头：锯几次分几段</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext">点木头上的位置锯一刀（再点一次取消），看看锯了几次、分成几段</div>
<svg id="s" viewBox="0 0 380 140" style="width:100%;max-width:640px;touch-action:none"></svg>
<div id="out" style="font-size:20px;line-height:1.9"></div>
<div class="sl"><b id="lt"></b><input type="range" min="1" max="10" value="3" id="tm"></div>
<div class="sl"><b id="lr"></b><input type="range" min="2" max="20" value="5" id="r"></div>
<div class="cc"><button class="btn ghost" id="cl">全部取消</button></div>
<hr style="margin:12px 0;border:0;border-top:1px solid var(--line)">
<div class="qtext" id="qq"></div><div class="chs" id="ch"></div><div class="msg" id="m"></div><div class="cc"><button class="btn ghost" id="nx">换一题</button></div></div>
<div class="panel"><b>规律：</b>锯的次数 = 段数 − 1（锯 1 刀是 2 段，锯 2 刀是 3 段……）。圆柱形木头每锯一刀，表面积增加 <b>2 个圆形截面</b>。</div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('锯木头：锯几次分几段');
var $=function(i){return document.getElementById(i)};

var cuts=[],Q,sc=0,X0=40,X1=340;
function draw(){var s='',cs=cuts.slice().sort(function(a,b){return a-b}),pts=[X0].concat(cs.map(function(c){return X0+c*(X1-X0)}),[X1]),i,col=['#d6a56b','#c08a4e'];
  for(i=0;i<pts.length-1;i++)s+='<rect x="'+(pts[i]+(i?3:0))+'" y="45" width="'+(pts[i+1]-pts[i]-(i?3:0)-(i<pts.length-2?3:0))+'" height="60" fill="'+col[i%2]+'" stroke="#7c4a1e" stroke-width="2"/>'+'<text x="'+((pts[i]+pts[i+1])/2)+'" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">'+(i+1)+'</text>';
  s+='<ellipse cx="'+X0+'" cy="75" rx="14" ry="30" fill="#e8c9a0" stroke="#7c4a1e" stroke-width="2"/>';
  cs.forEach(function(c){var x=X0+c*(X1-X0);s+='<line x1="'+x+'" y1="35" x2="'+x+'" y2="115" stroke="#e5484d" stroke-width="3" stroke-dasharray="5 4"/><text x="'+x+'" y="30" text-anchor="middle" font-size="16">✂️</text>'});
  s+='<rect id="hit" x="'+X0+'" y="30" width="'+(X1-X0)+'" height="90" fill="transparent" style="cursor:crosshair"/>';$('s').innerHTML=s;
  var k=cuts.length,t=+$('tm').value,r=+$('r').value;$('lt').textContent='每锯一刀用 '+t+' 分钟';$('lr').textContent='木头半径 '+r+' 厘米';
  $('out').innerHTML='锯了 <b>'+k+'</b> 次 → 分成 <b style="color:#4f46e5">'+(k+1)+'</b> 段<br>一共用时：'+k+' × '+t+' = <b>'+k*t+'</b> 分钟<br>表面积增加：'+k+' × 2 × 3.14 × '+r+'² = <b style="color:#e5484d">'+(k*2*3.14*r*r).toFixed(1)+'</b> 平方厘米';
  if(k>=4)Hub.star('cut-log',1)}
$('s').addEventListener('pointerdown',function(e){if(e.target.id!=='hit')return;var r=$('s').getBoundingClientRect(),f=((e.clientX-r.left)/r.width*380-X0)/(X1-X0);f=Math.round(f*20)/20;if(f<=0.04||f>=0.96)return;var i=cuts.indexOf(f);if(i>=0)cuts.splice(i,1);else if(cuts.length<9)cuts.push(f);draw()});
$('cl').onclick=function(){cuts=[];draw()};['tm','r'].forEach(function(k){$(k).addEventListener('input',draw)});
function newQ(){var n=Hub.rnd(3,9),t=Hub.rnd(2,6),ty=Hub.rnd(0,1);if(ty===0){Q={a:String(n-1)};$('qq').textContent='把一根木头锯成 '+n+' 段，要锯几次？';var o=[n-1,n,n+1,n-2].filter(function(x,i,a){return x>0&&a.indexOf(x)===i}).map(String);o.sort(function(){return Math.random()-.5});$('ch').innerHTML=o.map(function(x){return '<button class="ch" data-c="'+x+'">'+x+' 次</button>'}).join('')}
  else{Q={a:String((n-1)*t)};$('qq').textContent='把木头锯成 '+n+' 段，每锯一次要 '+t+' 分钟，一共要几分钟？';var o2=[(n-1)*t,n*t,(n+1)*t,(n-2)*t].filter(function(x,i,a){return x>0&&a.indexOf(x)===i}).map(String);o2.sort(function(){return Math.random()-.5});$('ch').innerHTML=o2.map(function(x){return '<button class="ch" data-c="'+x+'">'+x+' 分钟</button>'}).join('')}$('m').textContent=''}
$('ch').addEventListener('click',function(e){var c=e.target.dataset.c;if(c===undefined||!Q)return;var good=c===Q.a;Hub.beep(good);if(good){sc++;Hub.star('cut-log',sc>=4?3:sc>=2?2:1)}$('m').className='msg '+(good?'ok':'bad');$('m').textContent=good?'✔ 答对了（已对 '+sc+' 题）':'✘ 正确答案：'+Q.a+'。想一想：锯的次数比段数少 1，可以在上面的木头上试试';Q=null});
$('nx').onclick=newQ;cuts=[0.5];draw();newQ();
</script></body></html>
