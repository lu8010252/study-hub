<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>读钟面挑战</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="cc"><button class="btn" data-l="0">整时</button><button class="btn ghost" data-l="1">几时几分</button><button class="btn ghost" data-l="2">没有数字的钟面</button><button class="btn ghost" data-l="3">24 时计时法</button></div>
<div style="color:var(--sub)" id="info"></div><svg id="s" viewBox="0 0 200 200" style="width:100%;max-width:300px"></svg>
<div class="qtext" id="qq"></div><div class="chs" id="ch"></div><div class="msg" id="m"></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('读钟面挑战');
var $=function(i){return document.getElementById(i)};
function clockSvg(h,m,numbers,hands){var s='<circle cx="100" cy="100" r="92" fill="#fff" stroke="#334155" stroke-width="5"/>',i;
  for(i=0;i<60;i++){var a=i*6*Math.PI/180,r1=i%5?86:80;s+='<line x1="'+(100+Math.sin(a)*r1)+'" y1="'+(100-Math.cos(a)*r1)+'" x2="'+(100+Math.sin(a)*90)+'" y2="'+(100-Math.cos(a)*90)+'" stroke="#334155" stroke-width="'+(i%5?1:2.5)+'"/>'}
  if(numbers)for(i=1;i<=12;i++){var b=i*30*Math.PI/180;s+='<text x="'+(100+Math.sin(b)*66)+'" y="'+(100-Math.cos(b)*66+6)+'" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">'+i+'</text>'}
  var ha=((h%12)*30+m*.5)*Math.PI/180,ma=m*6*Math.PI/180;
  s+='<line x1="100" y1="100" x2="'+(100+Math.sin(ha)*46)+'" y2="'+(100-Math.cos(ha)*46)+'" stroke="#4338ca" stroke-width="7" stroke-linecap="round"/><line x1="100" y1="100" x2="'+(100+Math.sin(ma)*70)+'" y2="'+(100-Math.cos(ma)*70)+'" stroke="#e5484d" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="5" fill="#334155"/>';return s}
var lv=0,Q,i=0,ok=0,N=6,stars=0;
function f2(n){return (n<10?'0':'')+n}
function newQ(){var h=Hub.rnd(1,12),m=lv===0?0:Hub.rnd(0,11)*5,pm=Math.random()<.5;if(lv===1&&Math.random()<.4)m=Hub.rnd(0,59);
  var t=h+':'+f2(m),right,o=[];
  if(lv===3){var H=(h%12)+(pm?12:0);right=f2(H)+':'+f2(m);Q={h:h,m:m,right:right,txt:'钟面上是'+(pm?'下午':'上午')+'，用 24 时计时法表示是？'};
    o=[right,f2((H+12)%24)+':'+f2(m),f2(h)+':'+f2(m),f2((H+1)%24)+':'+f2(m)]}
  else{right=t;Q={h:h,m:m,right:right,txt:'现在是几时几分？'};o=[t,(m?m/5:m)>0&&m%5===0?(m/5)+':'+f2(h*5%60):h+':'+f2((m+30)%60),((h%12)+1)+':'+f2(m),(h===1?12:h-1)+':'+f2(m),h+':'+f2((m+5)%60)]}
  var seen={},oo=[];o.forEach(function(x){if(!seen[x]){seen[x]=1;oo.push(x)}});while(oo.length<4){var z=Hub.rnd(1,12)+':'+f2(m);if(!seen[z]){seen[z]=1;oo.push(z)}}oo=oo.slice(0,4);if(oo.indexOf(right)<0)oo[0]=right;oo.sort(function(){return Math.random()-.5});
  $('s').innerHTML=clockSvg(h,m,lv!==2);$('qq').textContent=Q.txt;$('ch').innerHTML=oo.map(function(x){return '<button class="ch" data-c="'+x+'" style="font-size:22px">'+x+'</button>'}).join('');$('m').textContent='';$('info').textContent='第 '+(i+1)+' / '+N+' 题 · 答对 '+ok}
$('ch').addEventListener('click',function(e){var c=e.target.dataset.c;if(c===undefined||!Q)return;var g=c===Q.right;if(g)ok++;Hub.beep(g);$('m').className='msg '+(g?'ok':'bad');$('m').textContent=g?'✔ 对了！':'✘ 正确是 '+Q.right+'（时针指几，分针指几个小格）';Q=null;setTimeout(function(){i++;if(i>=N){var st=ok>=N?3:ok>=N-1?2:ok>=3?1:0;Hub.star('clock-read',st);$('ch').innerHTML='';$('s').innerHTML='';$('qq').textContent='答对 '+ok+' / '+N+'  '+'★'.repeat(st)+'☆'.repeat(3-st);$('info').textContent='';setTimeout(function(){i=0;ok=0;newQ()},2600)}else newQ()},g?700:1800)});
document.addEventListener('click',function(e){var l=e.target.dataset.l;if(l!==undefined){lv=+l;i=0;ok=0;[].forEach.call(document.querySelectorAll('[data-l]'),function(x){x.classList.toggle('ghost',x.dataset.l!==l)});newQ()}});newQ();
</script></body></html>
