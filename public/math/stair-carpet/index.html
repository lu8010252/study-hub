<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>楼梯铺地毯</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext">给楼梯铺红地毯，要多长、多少平方米？</div>
<div class="sl"><b id="l1"></b><input type="range" min="2" max="12" value="6" id="n"></div>
<div class="sl"><b id="l2"></b><input type="range" min="10" max="25" value="16" id="h"></div>
<div class="sl"><b id="l3"></b><input type="range" min="20" max="35" value="28" id="d"></div>
<div class="sl"><b id="l4"></b><input type="range" min="60" max="150" step="10" value="100" id="w"></div>
<svg id="s" viewBox="0 0 380 220" style="width:100%;max-width:600px"></svg>
<div id="eq" style="font-size:19px;line-height:1.8"></div></div>
<div class="panel"><b>方法：</b>地毯沿台阶一级一级铺，把每级的“横着的踏面 + 竖着的踢面”拉直，就是一个长方形：长 = 台阶数 × (踏面 + 踢面)，宽 = 楼梯的宽。</div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('楼梯铺地毯');
var $=function(i){return document.getElementById(i)};

function draw(){var n=+$('n').value,h=+$('h').value,d=+$('d').value,w=+$('w').value;$('l1').textContent='台阶数 '+n;$('l2').textContent='每级高 '+h+' 厘米';$('l3').textContent='每级深 '+d+' 厘米';$('l4').textContent='宽 '+w+' 厘米';
  var k=Math.min(300/(n*d),130/(n*h)),s='',i,x0=30,y0=150;
  for(i=0;i<n;i++){var x=x0+i*d*k,y=y0-i*h*k;s+='<rect x="'+x+'" y="'+(y-h*k)+'" width="'+(d*k+(n-i)*0)+'" height="'+(h*k+(n-i-1)*h*k)+'" fill="#e2e8f0" stroke="#94a3b8"/>'}
  var path='M'+x0+' '+y0;for(i=0;i<n;i++){var xx=x0+i*d*k,yy=y0-i*h*k;path+=' L'+xx+' '+(yy-h*k)+' L'+(xx+d*k)+' '+(yy-h*k)}
  s+='<path d="'+path+'" fill="none" stroke="#e5484d" stroke-width="4" stroke-linejoin="round"/>';
  var L=n*(d+h),bw=Math.min(340,L*k*1.0);s+='<text x="30" y="188" font-size="12" fill="#64748b">拉直后：</text><rect x="80" y="176" width="'+Math.min(280,bw)+'" height="14" fill="#e5484d" rx="3"/><text x="'+(80+Math.min(280,bw)/2)+'" y="206" text-anchor="middle" font-size="12" fill="#e5484d" font-weight="700">'+n+' × ('+d+' + '+h+') = '+L+' 厘米</text>';
  $('s').innerHTML=s;var area=L*w;$('eq').innerHTML='地毯长 = '+n+' × ('+d+' + '+h+') = <b>'+L+'</b> 厘米<br>面积 = '+L+' × '+w+' = <b>'+area+'</b> 平方厘米 = <b>'+(area/10000).toFixed(2)+'</b> 平方米';Hub.star('stair-carpet',1)}
['n','h','d','w'].forEach(function(k){$(k).addEventListener('input',draw)});draw();
</script></body></html>
