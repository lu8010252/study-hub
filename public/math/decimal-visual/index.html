<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>小数的意义</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="qtext">一个大正方形表示 1，分成 100 小格，每格是 0.01。点百格图或用按钮改变小数</div>
<svg id="s" viewBox="0 0 220 220" style="width:100%;max-width:300px"></svg>
<div class="cc"><button class="btn ghost" data-d="-10">−0.1</button><button class="btn ghost" data-d="-1">−0.01</button><button class="btn" data-d="1">+0.01</button><button class="btn" data-d="10">+0.1</button></div>
<div class="big2" id="v"></div><div id="t" style="margin:6px 0"></div><div class="mut" id="r"></div>
<hr style="margin:12px 0;border:0;border-top:1px solid var(--line)">
<div class="qtext" id="qq"></div><div class="chs" id="ch"></div><div class="msg" id="m"></div>
<div class="cc"><button class="btn ghost" id="nx">换一题</button></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('小数的意义');
var $=function(i){return document.getElementById(i)};

var n=35,sc=0,Q;
var N=['零','一','二','三','四','五','六','七','八','九'];
function draw(){var s='',i,r,c;for(i=0;i<100;i++){r=Math.floor(i/10);c=i%10;var idx=c*10+(9-r);/* 竖着涂：每列10格=0.1 */
  var k=c*10+(9-r);s+='<rect data-i="'+k+'" x="'+(10+c*20)+'" y="'+(10+r*20)+'" width="20" height="20" fill="'+(k<n?(k<Math.floor(n/10)*10?'#6366f1':'#f59e0b'):'#fff')+'" stroke="#c7d2fe"/>'}
  $('s').innerHTML=s;var a=Math.floor(n/10),b=n%10,val=(n/100).toFixed(2).replace(/0$/,'').replace(/\.$/,'');if(n===100)val='1';
  $('v').textContent=val;
  $('t').innerHTML=n===100?'整个正方形是 1':'<span style="color:#4f46e5">'+a+' 列 = '+a+' 个 0.1</span>　<span style="color:#d97706">+ '+b+' 格 = '+b+' 个 0.01</span>';
  $('r').textContent=n===100?'读作：一':'读作：'+(n<10&&n>0?'零点零'+N[b]:n%10===0?'零点'+N[a]:'零点'+N[a]+N[b])+'　　= '+n+'/100'+(n%10===0&&n>0?' = '+a+'/10':'');
  if(n===0)$('r').textContent='读作：零'}
$('s').addEventListener('pointerdown',function(e){var i=e.target.dataset.i;if(i===undefined)return;n=+i+1===n?+i:+i+1;draw()});
document.addEventListener('click',function(e){var d=e.target.dataset.d;if(d){n=Math.max(0,Math.min(100,n+ +d));draw()}});
function newQ(){var m=Hub.rnd(1,99),t=Hub.rnd(0,1);Q={n:m};var val=m/100,ans;
  if(t===0){var s=m<10?'0.0'+m:(m%10===0?'0.'+m/10:'0.'+m);Q.ans=s;Q.text='涂色部分是 '+m+' 小格，用小数表示是多少？';
    var set=[s,'0.'+(m<10?'0'+m:String(m).split('').reverse().join('')),(m/10).toString(),(m*10/100+0.1).toFixed(2)];}
  else{var s2=m<10?'0.0'+m:(m%10===0?'0.'+m/10:'0.'+m);Q.ans=m+'/100'.slice(0,0)+'个0.01';Q.text=s2+' 里面有几个 0.01 ？';Q.ans=m+' 个';var set=[m+' 个',(m*10)+' 个',Math.max(1,Math.floor(m/10))+' 个',(m+1)+' 个']}
  var o=[Q.ans];set.forEach(function(x){if(o.indexOf(x)<0&&o.length<4)o.push(x)});while(o.length<4){var z=t===0?'0.'+Hub.rnd(1,99):Hub.rnd(1,99)+' 个';if(o.indexOf(z)<0)o.push(z)}
  o.sort(function(){return Math.random()-.5});$('qq').innerHTML=Q.text;$('ch').innerHTML=o.map(function(x){return '<button class="ch" data-c="'+x+'">'+x+'</button>'}).join('');$('m').textContent='';
  if(t===0){n=m;draw()}}
$('ch').addEventListener('click',function(e){var c=e.target.dataset.c;if(c===undefined||!Q)return;var good=c===Q.ans;Hub.beep(good);if(good){sc++;Hub.star('decimal-visual',sc>=5?3:sc>=3?2:1)}
  $('m').className='msg '+(good?'ok':'bad');$('m').textContent=good?'✔ 答对了（已对 '+sc+' 题）':'✘ 正确答案：'+Q.ans;Q=null});
$('nx').onclick=newQ;draw();newQ();
</script></body></html>
