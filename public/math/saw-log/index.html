<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>锯木头与爬楼梯</title><link rel="stylesheet" href="/css/hub.css">
<style>.cc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.cc .btn{min-height:44px}
.big2{font-size:26px;font-weight:800}.mut{color:var(--sub)}svg{touch-action:none}
input[type=range]{width:100%;max-width:320px;height:36px}.sl{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0}.sl b{min-width:90px;text-align:right}
</style></head>
<body><div class="page">
<div class="panel" style="text-align:center">
<div class="cc"><button class="btn" data-m="l">锯木头</button><button class="btn ghost" data-m="s">爬楼梯</button></div>
<div class="sl"><b id="ln"></b><input type="range" min="2" max="10" value="5" id="n"></div>
<svg id="s" viewBox="0 0 380 140" style="width:100%;max-width:600px"></svg>
<div class="cc"><button class="btn" id="cut">🪚 锯一次</button><button class="btn ghost" id="rs">重来</button></div>
<div class="big2" id="eq"></div><div class="mut" id="tip"></div>
<hr style="margin:12px 0;border:0;border-top:1px solid var(--line)">
<div class="qtext" id="qq"></div><div class="chs" id="ch"></div><div class="msg" id="m"></div><div class="cc"><button class="btn ghost" id="nx">换一题</button></div></div>
</div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('锯木头与爬楼梯');
var $=function(i){return document.getElementById(i)};

var mode='l',k=0,sc=0,Q;
function draw(){var n=+$('n').value,s='',i;$('ln').textContent=mode==='l'?'锯成 '+n+' 段':'爬到 '+n+' 楼';
  if(mode==='l'){var W=340/n;for(i=0;i<n;i++){var shown=i<k+1;s+='<rect x="'+(20+i*W+(i<=k?i*(i<=k?6:0):0))+'" y="50" width="'+(W-3)+'" height="46" rx="6" fill="'+(i%2?'#d6a86b':'#c68e4e')+'" stroke="#7c4a1d" stroke-width="2"/>'}
    /* 锯口 */var parts='';parts=s;s='';var gap=6;for(i=0;i<n;i++){var x=20+i*W+Math.min(i,k)*gap;s+='<rect x="'+x+'" y="50" width="'+(W-3)+'" height="46" rx="6" fill="'+(i%2?'#d6a86b':'#c68e4e')+'" stroke="#7c4a1d" stroke-width="2"/>'}
    for(i=1;i<n;i++)if(i>k)s+='<line x1="'+(20+i*W+k*gap-1.5)+'" y1="46" x2="'+(20+i*W+k*gap-1.5)+'" y2="100" stroke="#e5484d" stroke-width="2" stroke-dasharray="4 3"/>';
    $('eq').textContent='锯了 '+k+' 次，现在是 '+(k+1)+' 段';$('tip').textContent=(n-1)+' 次可以锯成 '+n+' 段：段数 = 次数 + 1'}
  else{for(i=1;i<=n;i++){var sx=20+(i-1)*(320/n),sy=120-(i-1)*(90/Math.max(1,n-1)),on=i<=k+1;s+='<rect x="'+sx+'" y="'+sy+'" width="'+(320/n)+'" height="'+(130-sy)+'" fill="'+(on?'#a5b4fc':'#e2e8f0')+'" stroke="#4338ca" stroke-width="2"/><text x="'+(sx+160/n)+'" y="'+(sy-4)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">'+i+'楼</text>'}
    $('eq').textContent='已爬了 '+k+' 段楼梯，现在在 '+(k+1)+' 楼';$('tip').textContent='爬到 '+n+' 楼要爬 '+(n-1)+' 段楼梯：楼梯段数 = 楼层数 − 1'}
  $('s').innerHTML=s;$('cut').textContent=mode==='l'?'🪚 锯一次':'🚶 上一层';if(k>=n-1&&!draw.d){draw.d=1;Hub.star('saw-log',1)}}
$('n').addEventListener('input',function(){k=0;draw.d=0;draw()});$('cut').onclick=function(){var n=+$('n').value;if(k<n-1){k++;Hub.beep(true);draw()}};$('rs').onclick=function(){k=0;draw()};
document.addEventListener('click',function(e){var m=e.target.dataset.m;if(m){mode=m;k=0;[].forEach.call(document.querySelectorAll('[data-m]'),function(x){x.classList.toggle('ghost',x.dataset.m!==m)});draw();newQ()}});
function newQ(){var n=Hub.rnd(3,9),t=Hub.rnd(2,6),r=mode==='l'?(n-1)*t:(n-1)*t;Q={a:r};var txt=mode==='l'?'把一根木头锯成 '+n+' 段，每锯一次要 '+t+' 分钟，一共要几分钟？':'爬到 '+n+' 楼，每上一层要 '+t+' 秒，一共要几秒？(从 1 楼出发)';var o=[r,n*t,(n+1)*t,(n-2)*t].filter(function(x,i,a){return a.indexOf(x)===i&&x>0});while(o.length<4)o.push(r+o.length*t);o.sort(function(){return Math.random()-.5});
  $('qq').textContent=txt;$('ch').innerHTML=o.map(function(x){return '<button class="ch" data-c="'+x+'">'+x+'</button>'}).join('');$('m').textContent=''}
$('ch').addEventListener('click',function(e){var c=e.target.dataset.c;if(c===undefined||!Q)return;var g=+c===Q.a;Hub.beep(g);if(g){sc++;Hub.star('saw-log',sc>=4?3:sc>=2?2:1)}$('m').className='msg '+(g?'ok':'bad');$('m').textContent=g?'✔ 对了：次数比段数少 1':'✘ 正确答案 '+Q.a+'：先算锯（或爬）的次数，再乘时间';Q=null});
$('nx').onclick=newQ;draw();newQ();
</script></body></html>
