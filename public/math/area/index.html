<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>面积与周长</title><link rel="stylesheet" href="/css/hub.css"></head>
<body><div class="page">
<div class="panel" style="text-align:center">
 <svg id="s" viewBox="0 0 440 340" style="width:100%;max-width:640px"></svg>
 <div class="row" style="justify-content:center;gap:30px"><div>长 <b id="l"></b> 宽 <b id="w"></b></div><div>周长 <b id="p" class="big"></b></div><div>面积 <b id="a" class="big"></b></div></div>
 <p style="color:var(--sub)">拖动右下角的圆点改变长方形大小（每格 1 厘米）</p>
</div>
<div class="panel" style="text-align:center">
 <div id="task" style="font-weight:700;font-size:20px"></div>
 <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="chk">检查</button><button class="btn ghost" id="nx">换一题</button></div>
 <div class="msg" id="m"></div>
</div></div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('面积与周长');
var $=function(i){return document.getElementById(i)};
var U=40,W=2,H=2,MAXW=10,MAXH=8,svg=$('s'),drag=false,goal=null,solved=0;
function draw(){
  var s='',i;
  for(i=0;i<=MAXW;i++)s+='<line x1="'+(20+i*U)+'" y1="20" x2="'+(20+i*U)+'" y2="'+(20+MAXH*U)+'" stroke="currentColor" stroke-opacity=".15"/>';
  for(i=0;i<=MAXH;i++)s+='<line x1="20" y1="'+(20+i*U)+'" x2="'+(20+MAXW*U)+'" y2="'+(20+i*U)+'" stroke="currentColor" stroke-opacity=".15"/>';
  s+='<rect x="20" y="20" width="'+(W*U)+'" height="'+(H*U)+'" fill="#6366f1" fill-opacity=".35" stroke="#6366f1" stroke-width="4"/>';
  s+='<circle id="h" cx="'+(20+W*U)+'" cy="'+(20+H*U)+'" r="16" fill="#f59e0b" stroke="#fff" stroke-width="3" style="cursor:nwse-resize"/>';
  svg.innerHTML=s;
  $('l').textContent=W;$('w').textContent=H;$('p').textContent=2*(W+H);$('a').textContent=W*H;
}
function pt(e){var r=svg.getBoundingClientRect();return [(e.clientX-r.left)/r.width*440,(e.clientY-r.top)/r.height*340]}
svg.addEventListener('pointerdown',function(e){if(e.target.id!=='h')return;drag=true;svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',function(e){if(!drag)return;var p=pt(e),w=Math.max(1,Math.min(MAXW,Math.round((p[0]-20)/U))),h=Math.max(1,Math.min(MAXH,Math.round((p[1]-20)/U)));if(w!==W||h!==H){W=w;H=h;draw()}});
function up(){drag=false}svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
function pick(){
  var k=Hub.rnd(0,2),w,h;
  do{w=Hub.rnd(1,MAXW);h=Hub.rnd(1,MAXH)}while(w*h<4);
  if(k===0)goal={a:w*h,t:'拼出面积是 '+w*h+' 平方厘米的长方形'};
  else if(k===1)goal={p:2*(w+h),t:'拼出周长是 '+2*(w+h)+' 厘米的长方形'};
  else goal={a:w*h,p:2*(w+h),t:'拼出面积 '+w*h+' 平方厘米、周长 '+2*(w+h)+' 厘米的长方形'};
  $('task').textContent=goal.t;$('m').textContent='';
}
$('chk').onclick=function(){
  var ok=(goal.a===undefined||goal.a===W*H)&&(goal.p===undefined||goal.p===2*(W+H));
  if(ok){solved++;$('m').className='msg ok';$('m').textContent='✔ 对了！已完成 '+solved+' 题';Hub.beep(true);Hub.star('area',solved>=5?3:solved>=3?2:1)}
  else{$('m').className='msg bad';$('m').textContent='现在 面积='+W*H+'，周长='+2*(W+H)+'，再调一调';Hub.beep(false)}
};
$('nx').onclick=pick;
pick();draw();
</script></body></html>
