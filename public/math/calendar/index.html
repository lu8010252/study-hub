<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>年历与平年闰年</title><link rel="stylesheet" href="/css/hub.css">
<style>table{border-collapse:collapse;width:100%;max-width:520px;margin:0 auto}th,td{text-align:center;height:46px;border:1px solid var(--line)}th{background:var(--bg);color:var(--p1)}td.we{color:var(--bad)}td.td{background:var(--p1);color:#fff;border-radius:10px}td.sel{background:#fde68a;color:#23224a;font-weight:800}td{cursor:pointer}</style></head>
<body><div class="page">
<div class="panel" style="text-align:center"><div class="row" style="justify-content:center"><button class="btn ghost" id="py">«</button><button class="btn ghost" id="pm">‹</button><b class="big" id="ttl" style="min-width:170px"></b><button class="btn ghost" id="nm">›</button><button class="btn ghost" id="ny">»</button></div>
<div id="info" style="margin:8px 0;min-height:60px;line-height:1.8"></div><table id="t"></table>
<p style="color:var(--sub)">点一个日期，看它是星期几</p></div>
<div class="panel"><b>平年和闰年</b>：闰年全年 366 天（2 月 29 天），平年全年 365 天（2 月 28 天）。<br><b>判断</b>：年份是 4 的倍数是闰年；但<b>整百年份必须是 400 的倍数</b>才是闰年（1900 年不是，2000 年是）。<br><b>大月</b>（31 天）：1、3、5、7、8、10、12 月；<b>小月</b>（30 天）：4、6、9、11 月。</div></div>
<script src="/js/tool.js"></script>
<script>
Hub.bar('年历与平年闰年');
var $=function(i){return document.getElementById(i)};
var now=new Date(),Y=now.getFullYear(),M=now.getMonth(),sel=null;
function leap(y){return y%4===0&&(y%100!==0||y%400===0)}
function dim(y,m){return [31,leap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m]}
function draw(){
  $('ttl').textContent=Y+' 年 '+(M+1)+' 月';
  var first=(new Date(Y,M,1).getDay()+6)%7,n=dim(Y,M),h='<tr>'+['一','二','三','四','五','六','日'].map(function(d){return '<th>'+d+'</th>'}).join('')+'</tr><tr>',i,c=0;
  for(i=0;i<first;i++){h+='<td></td>';c++}
  for(i=1;i<=n;i++){var cls=(c%7>=5?'we ':'')+(Y===now.getFullYear()&&M===now.getMonth()&&i===now.getDate()?'td ':'')+(sel===i?'sel':'');h+='<td class="'+cls+'" data-d="'+i+'">'+i+'</td>';c++;if(c%7===0&&i<n)h+='</tr><tr>'}
  while(c%7){h+='<td></td>';c++}
  $('t').innerHTML=h+'</tr>';
  $('info').innerHTML=Y+' 年是<b style="color:'+(leap(Y)?'var(--ok)':'var(--p1)')+'">'+(leap(Y)?'闰年':'平年')+'</b>，全年 '+(leap(Y)?366:365)+' 天；'+(M+1)+' 月有 <b>'+n+'</b> 天（'+(n===31?'大月':n===30?'小月':'特殊的二月')+'），共 '+Math.ceil((first+n)/7)+' 个星期行。'+(sel?'<br>'+Y+'年'+(M+1)+'月'+sel+'日是 <b>星期'+'日一二三四五六'[new Date(Y,M,sel).getDay()]+'</b>':'');
}
$('t').onclick=function(e){var d=e.target.dataset.d;if(d){sel=+d;Hub.star('calendar',1);draw()}};
function go(dm,dy){M+=dm;Y+=dy;if(M<0){M=11;Y--}if(M>11){M=0;Y++}sel=null;draw()}
$('pm').onclick=function(){go(-1,0)};$('nm').onclick=function(){go(1,0)};$('py').onclick=function(){go(0,-1)};$('ny').onclick=function(){go(0,1)};
draw();
</script></body></html>
