<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>作业小伙伴</title>
<link rel="stylesheet" href="/css/hub.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;flex:none}
.bar a{color:#fff;text-decoration:none;font-size:22px;min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center}
.bar h1{margin:0;font-size:18px;flex:1}
.bar button{color:#fff;background:rgba(255,255,255,.2);border-radius:16px;padding:6px 12px;font-size:14px;min-height:36px}
.subj{display:flex;gap:8px;padding:10px 14px 0;flex:none;max-width:820px;width:100%;margin:0 auto;box-sizing:border-box}
.subj button{flex:1;min-height:42px;border-radius:21px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:16px}
.subj button.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent}
#log{flex:1;overflow-y:auto;padding:12px 14px;max-width:820px;width:100%;margin:0 auto;box-sizing:border-box}
.m{display:flex;gap:8px;margin:10px 0;align-items:flex-start}
.m .av{width:36px;height:36px;border-radius:50%;background:#fde68a;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.m .bb{max-width:80%;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;font-size:17px;line-height:1.6}
.m.u{flex-direction:row-reverse}
.m.u .av{background:#c7d2fe}
.m.u .bb{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent}
.m.err .bb{border-color:var(--bad);color:var(--bad)}
.m.wait .bb{color:var(--sub)}
.tip{margin:8px auto;text-align:center;color:var(--sub);font-size:14px}
.box{flex:none;padding:8px 14px calc(10px + env(safe-area-inset-bottom));max-width:820px;width:100%;margin:0 auto;box-sizing:border-box}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-height:48px;max-height:140px;padding:11px 14px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;resize:none;outline:none;box-sizing:border-box}
textarea:focus{border-color:var(--p1)}
#send{min-width:72px;min-height:48px;padding:0 16px;border-radius:24px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-weight:700;font-size:17px}
#send:disabled{opacity:.5}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.dlg.on{display:flex}
.dlg .in{background:var(--card);border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:80vh;overflow:auto}
.dlg h3{margin:0 0 10px}
.dlg pre{white-space:pre-wrap;word-break:break-word;font:inherit;margin:0 0 12px}
.dlg button{min-height:44px;padding:0 20px;border-radius:22px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="bar"><a href="/" title="回到学习中心">←</a><h1>🌟 作业小伙伴</h1><button id="par">家长看总结</button><button id="clr">换一道题</button></div>
<div class="subj" id="subj"><button data-s="数学" class="on">➕ 数学</button><button data-s="语文">📖 语文</button><button data-s="英语">🔤 英语</button></div>
<div id="log"></div>
<div class="box">
  <div class="row"><textarea id="in" rows="1" placeholder="把不会的题打出来,或者告诉我卡在哪一步…"></textarea><button id="send">发送</button></div>
</div>
<div class="dlg" id="dlg"><div class="in"><h3 id="dt"></h3><pre id="db"></pre><button id="dc">知道了</button></div></div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var KEY='homework.v1', subj='数学', msgs=[], busy=false, startAt=Date.now(), nudged=false;
  var log=$('log'), inp=$('in'), send=$('send');
  function load(){try{var j=JSON.parse(localStorage.getItem(KEY)||'{}');if(j.subj)subj=j.subj;if(Array.isArray(j.msgs))msgs=j.msgs.slice(-24);if(j.startAt&&Date.now()-j.startAt<6*3600*1000)startAt=j.startAt}catch(e){}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({subj:subj,msgs:msgs,startAt:startAt}))}catch(e){}}
  function add(role,text,cls){
    var d=document.createElement('div');d.className='m '+(role==='user'?'u':'a')+(cls?' '+cls:'');
    var a=document.createElement('div');a.className='av';a.textContent=role==='user'?'🙂':'⭐';
    var b=document.createElement('div');b.className='bb';b.textContent=text;
    d.appendChild(a);d.appendChild(b);log.appendChild(d);log.scrollTop=log.scrollHeight;return d;
  }
  function tip(t){var d=document.createElement('div');d.className='tip';d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
  function drawSubj(){Array.prototype.forEach.call($('subj').children,function(b){b.className=b.getAttribute('data-s')===subj?'on':''})}
  function render(){
    log.innerHTML='';
    if(!msgs.length){add('assistant','嗨,我是星星姐姐 ⭐\n今天想做哪一科?把不会的题告诉我吧,我陪你一步一步想。')}
    msgs.forEach(function(m){add(m.role,m.content)});
    drawSubj();
  }
  function post(path,payload){
    return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('出错了 '+r.status));return j})});
  }
  function go(){
    var t=inp.value.trim();if(!t||busy)return;
    inp.value='';inp.style.height='';
    var content=msgs.length?t:('【'+subj+'】'+t);
    if(!msgs.length)log.innerHTML='';
    msgs.push({role:'user',content:content});
    add('user',t);save();
    busy=true;send.disabled=true;
    var w=add('assistant','星星姐姐在想…','wait');
    post('/api/homework/chat',{messages:msgs}).then(function(j){
      w.remove();msgs.push({role:'assistant',content:j.reply});add('assistant',j.reply);save();
      if(!nudged&&Date.now()-startAt>25*60*1000){nudged=true;tip('⏰ 已经学了 25 分钟啦,站起来喝口水、活动 5 分钟吧')}
    }).catch(function(e){
      w.remove();msgs.pop();save();add('assistant',e.message||'出错了','err');inp.value=t;
    }).then(function(){busy=false;send.disabled=false;inp.focus()});
  }
  function dlg(t,b){$('dt').textContent=t;$('db').textContent=b;$('dlg').className='dlg on'}
  $('dc').onclick=function(){$('dlg').className='dlg'};
  send.onclick=go;
  inp.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();go()}};
  inp.oninput=function(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px'};
  $('subj').onclick=function(e){var s=e.target.getAttribute('data-s');if(s){subj=s;save();drawSubj()}};
  $('clr').onclick=function(){if(msgs.length&&!confirm('清空这次对话,换一道新题?'))return;msgs=[];startAt=Date.now();nudged=false;save();render()};
  $('par').onclick=function(){
    var real=msgs.filter(function(m){return m.content});
    if(real.length<2){dlg('家长总结','今天还没有聊几句,等孩子写完作业再来看吧。');return}
    dlg('家长总结','正在整理…');
    post('/api/homework/parent',{messages:real.concat(real[real.length-1].role==='user'?[]:[{role:'user',content:'请给家长写今天的总结。'}])})
      .then(function(j){dlg('家长总结',j.reply)}).catch(function(e){dlg('家长总结',e.message||'出错了')});
  };
  load();render();
  fetch('/api/homework/config',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(!j.enabled)tip('⚠️ 还没有配置大模型:请在 docker-compose 里填写 LLM_BASE_URL / LLM_API_KEY / LLM_MODEL')
  }).catch(function(){});
})();
</script>
</body>
</html>
