<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>英语单词练习</title>
<link rel="stylesheet" href="/css/hub.css">
<link rel="stylesheet" href="/css/study.css">
</head>
<body><div class="page" id="app"></div>
<input id="kb" type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="打字输入">
<script src="/js/tool.js"></script>
<script src="/js/study.js"></script>
<script>
Hub.bar('英语单词练习');
(function(){
var KEY='hub.words',CH=10,BOOKS=[],$=function(i){return document.getElementById(i)},app=$('app'),kb=$('kb'),esc=Study.esc,shuf=Study.shuf;
var D=Study.load(KEY),S=D.set;S.mode=S.mode||'copy';S.acc=S.acc||'uk';S.book=S.book||'4s';
function save(){Study.save(KEY,D)}
function say(w){Study.say(w,S.acc)}
function ph(p){p=(p||'').split(';')[0].trim();return p?'/'+p.replace(/^\/|\/$/g,'')+'/':''}
function bookOf(id){return BOOKS.filter(function(b){return b.id===id})[0]||BOOKS[0]}
function chapters(b){var n=Math.ceil(b.words.length/CH),r=[];for(var i=0;i<n;i++)r.push(b.words.slice(i*CH,i*CH+CH));return r}
function key(w){return w}
var R=null,RES=null;
/* ---------- 首页 ---------- */
function home(){
  kb.blur();R=null;var b=bookOf(S.book),wn=Object.keys(D.wrong).length,due=Study.due(D).length,learned=Object.keys(D.cards).length;
  var h='<div class="sp-hero"><h2>⌨️ 单词打字练习</h2><p>边听边打，把单词敲进肌肉记忆 · 人教 PEP 三年级起点</p><div class="sp-pills">'
   +'<div class="sp-pill"><b>'+Study.today(D)+'</b><small>今天练了（词）</small></div>'
   +'<div class="sp-pill"><b>'+Study.streak(D)+'</b><small>连续练习（天）</small></div>'
   +'<div class="sp-pill"><b>'+learned+'</b><small>已学过（词）</small></div></div></div>';
  if(due)h+='<div class="sp-rv"><div class="ic">🔁</div><div><b>今天有 '+due+' 个词该复习了</b><small>按遗忘规律安排，趁还记得，几分钟就能搞定</small></div><button class="btn" id="rv">开始复习</button></div>';
  h+='<div class="panel"><div class="chips"><b>课本</b>'+BOOKS.map(function(x){return '<button class="chip'+(x.id===b.id?' on':'')+'" data-bk="'+x.id+'">'+x.name+'</button>'}).join('')+'</div>'
   +'<div class="chips"><b>方式</b><button class="chip'+(S.mode==='copy'?' on':'')+'" data-md="copy">👀 看词跟打</button><button class="chip'+(S.mode==='dict'?' on':'')+'" data-md="dict">✍️ 听音默写</button>'
   +'<b style="margin-left:10px">发音</b><button class="chip'+(S.acc==='uk'?' on':'')+'" data-ac="uk">英音</button><button class="chip'+(S.acc==='us'?' on':'')+'" data-ac="us">美音</button></div>'
   +'<p class="note" style="margin:0">每章 '+CH+' 个词。打错一个字母，这个词要重新打；打错的词进错词本，练过的词会按遗忘规律安排复习。</p></div>';
  h+='<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:12px"><b style="font-size:19px">'+b.name+'<span style="color:var(--sub);font-weight:500;font-size:14px">　共 '+b.words.length+' 词</span></b>'
   +'<button class="btn ghost" id="wb"'+(wn?'':' disabled')+'>📕 错词本 '+wn+'</button></div><div class="cg">'
   +chapters(b).map(function(c,i){var p=D.prog[b.id+'-'+i]||{},ln=c.filter(function(w){return D.cards[key(w[0])]}).length,s=Study.stars(p.acc||0);
     return '<button class="cc" data-ch="'+i+'"><span class="no">'+(i+1)+'</span><span class="st">'+(p.acc?'★'.repeat(s)+'☆'.repeat(3-s):'☆☆☆')+'</span><b>第 '+(i+1)+' 章</b><small>'+esc(c[0][0])+' · '+esc(c[c.length-1][0])+'</small><small>已学 '+ln+'/'+c.length+(p.acc?' · 最好 '+p.acc+'%':'')+'</small><span class="bar"><i style="width:'+Math.round(ln/c.length*100)+'%"></i></span></button>'}).join('')
   +'</div></div><div class="foot"><button id="clr">清除英语单词练习的本机数据</button><div class="note" style="margin-top:8px">词库：<a href="https://github.com/RealKai42/qwerty-learner" style="text-decoration:underline">qwerty-learner</a>（GPL-3.0）· 复习算法思路参考 keykey 的轻量 FSRS · 发音：有道词典</div></div>';
  app.innerHTML=h;
}
/* ---------- 练习 ---------- */
function start(list,title,meta){
  R={list:list,title:title,meta:meta,i:0,pos:0,keys:0,okKeys:0,t0:Date.now(),bad:{},clean:{},cur:{err:0},lock:false,reveal:false,combo:0,best:0,done:0,perfect:0};
  app.innerHTML='<div class="panel"><div class="sp-top"><button class="mini" id="ex">← 退出</button><span class="t">'+esc(title)+'</span><span class="cnt" id="cnt"></span><span class="combo" id="combo"></span></div><div class="prog"><i id="pg"></i></div>'
   +'<div class="stg" id="stage"><div class="say" id="say"></div><div class="zh" id="zh"></div><div class="ph" id="ph"></div><div class="wd" id="wd"></div><div><span class="tag" id="tag"></span></div>'
   +'<div class="sp-act"><button class="sound" id="snd" aria-label="再听一遍">🔊</button>'+(S.mode==='dict'?'<button class="mini" id="tip">💡 提示一下</button>':'')+'</div></div></div>'
   +'<p class="note" style="text-align:center">请用英文输入法 · 点一下上面的方块可以呼出键盘 · 回车键 = 再听一遍</p>';
  next0();
}
function cw(){return R.list[R.i]}
function focus(){try{kb.value='';kb.focus()}catch(e){}}
function setSay(t){var e=$('say');if(e)e.textContent=t}
function next0(){
  var w=cw();R.pos=0;R.cur={err:0,hint:false};R.reveal=false;R.lock=false;R.ws=Date.now();
  $('stage').className='stg';$('zh').textContent=w[1];$('ph').textContent=ph(w[2]);$('tag').textContent='';$('tag').className='tag';
  $('cnt').textContent=(R.i+1)+' / '+R.list.length;$('pg').style.width=(R.i/R.list.length*100)+'%';
  setSay(R.combo>=3?'🔥 连击中，继续！':S.mode==='dict'?'👂 听发音，把单词拼出来':'👀 照着单词打');
  drawWord();say(w[0]);focus();
}
function drawWord(){
  var w=cw()[0],h='';
  for(var k=0;k<w.length;k++){
    var c=w[k];if(c===' '){h+='<span class="gap"></span>';continue}
    var cl='ch'+(k<R.pos?' done':k===R.pos?' cur':'');
    var hide=S.mode==='dict'&&k>=R.pos&&!R.reveal;
    if(hide)cl+=' hid';else if(R.reveal&&k>=R.pos)cl+=' rv';
    h+='<span class="'+cl+'">'+esc(c)+'</span>';
  }
  $('wd').innerHTML=h;
}
function grade(){
  if(R.cur.hint)return 1;
  var e=R.cur.err,spc=(Date.now()-R.ws)/1000/Math.max(1,cw()[0].length);
  return e===0?(spc<1.1?4:3):e===1?3:2;
}
function type(ch){
  if(!R||R.lock)return;
  var w=cw()[0],ex=w[R.pos];
  if(ex===' '){R.pos++;ex=w[R.pos]}
  if(ch===' ')return drawWord();
  R.keys++;
  if(ex!==undefined&&ch.toLowerCase()===ex.toLowerCase()){
    R.okKeys++;R.pos++;
    if(R.pos<w.length&&w[R.pos]===' ')R.pos++;
    drawWord();
    if(R.pos>=w.length)complete();
  }else{
    Hub.beep(false);R.cur.err++;R.bad[w]=(R.bad[w]||0)+1;
    D.wrong[w]=D.wrong[w]||{zh:cw()[1],ph:cw()[2],n:0};D.wrong[w].n++;save();
    R.pos=0;R.combo=0;$('combo').textContent='';setSay('没关系，再来一次 💪');
    var st=$('stage');st.classList.remove('bad');void st.offsetWidth;st.classList.add('bad');
    if(S.mode==='dict'){R.reveal=true;drawWord();R.lock=true;setTimeout(function(){if(!R)return;R.reveal=false;R.lock=false;drawWord()},1200)}
    else drawWord();
  }
}
function complete(){
  var w=cw(),rt=grade(),out=Study.rate(D,key(w[0]),rt,{zh:w[1],ph:w[2]});
  R.lock=true;R.done++;Hub.beep(true);$('stage').classList.add('good');Study.log(D,1);
  var clean=R.cur.err===0&&!R.cur.hint;
  if(clean){R.clean[w[0]]=1;R.perfect++;R.combo++;if(R.combo>R.best)R.best=R.combo;
    var c=$('combo');c.textContent='🔥 '+R.combo;c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')}
  var tg=$('tag');tg.className='tag '+(clean?'ok':'rough');tg.textContent=(clean?'✓ 全对':'再多练练')+' · 下次复习 '+Study.label(rt,out.days);
  save();R.i++;
  setTimeout(function(){if(R)R.i>=R.list.length?finish():next0()},850);
}
kb.addEventListener('input',function(e){
  if(e.isComposing)return;var v=kb.value;kb.value='';
  for(var i=0;i<v.length;i++)if(/[A-Za-z' .\-]/.test(v[i]))type(v[i]);
});
kb.addEventListener('keydown',function(e){
  if(!R)return;
  if(e.key==='Enter'){e.preventDefault();say(cw()[0])}else if(e.key==='Escape'){home()}
});
/* ---------- 结算 ---------- */
function finish(){
  var sec=Math.max(1,Math.round((Date.now()-R.t0)/1000)),acc=R.keys?Math.round(R.okKeys/R.keys*100):100,bad=Object.keys(R.bad),t=R.meta.type;
  if(t==='wrong'){Object.keys(R.clean).forEach(function(w){delete D.wrong[w]})}
  else if(t==='ch'){var k=R.meta.key,p=D.prog[k]||{};if(acc>(p.acc||0))p.acc=acc;p.n=(p.n||0)+1;D.prog[k]=p;Hub.star('words',Study.stars(acc))}
  save();kb.blur();
  RES={list:R.list,title:R.title,meta:R.meta,bad:bad};
  var h='<div class="panel res"><div class="em">'+(acc>=95?'🏆':acc>=85?'🎉':'💪')+'</div><div class="big">'+esc(R.title)+' 完成！</div>'
   +'<div class="sum"><div><b>'+acc+'%</b><small>正确率</small></div><div><b>'+(sec>=60?Math.floor(sec/60)+"'"+('0'+sec%60).slice(-2)+'"':sec+' 秒')+'</b><small>用时</small></div><div><b>'+R.best+'</b><small>最高连击</small></div></div>';
  if(bad.length)h+='<div style="text-align:left"><b>这几个词要多练练（'+bad.length+'）：</b><div class="wl">'+bad.map(function(w){var x=R.list.filter(function(y){return y[0]===w})[0];return '<div><b>'+esc(w)+'</b><small>'+esc(x[1])+'</small></div>'}).join('')+'</div></div>';
  else h+='<p style="color:var(--ok);font-weight:700;font-size:18px">一个都没错，太棒了！</p>';
  h+='<div class="row" style="justify-content:center;margin-top:12px">';
  if(bad.length)h+='<button class="btn" id="again-bad">练打错的词</button>';
  if(t==='ch')h+='<button class="btn ghost" id="again">再来一遍</button>';
  if(t==='ch'&&R.meta.next!=null)h+='<button class="btn ok" id="nextch">下一章 ▶</button>';
  h+='<button class="btn ghost" id="back">回首页</button></div></div>';
  app.innerHTML=h;if(acc>=80)Study.confetti(app.firstChild);
}
function startCh(b,i){var cs=chapters(b);start(shuf(cs[i]),b.name+' 第'+(i+1)+'章',{type:'ch',key:b.id+'-'+i,book:b.id,idx:i,next:i+1<cs.length?i+1:null})}
function wrongList(){return Object.keys(D.wrong).map(function(w){return [w,D.wrong[w].zh,D.wrong[w].ph]})}
document.addEventListener('click',function(e){
  var t=e.target.closest('button,#stage');if(!t)return;
  if(t.id==='stage'){if(R)focus();return}
  var d=t.dataset,b=bookOf(S.book);
  if(d.bk){S.book=d.bk;save();home()}
  else if(d.md){S.mode=d.md;save();home()}
  else if(d.ac){S.acc=d.ac;save();home()}
  else if(d.ch!==undefined)startCh(b,+d.ch);
  else if(t.id==='wb'){var l=wrongList();if(l.length)start(shuf(l),'错词本',{type:'wrong'})}
  else if(t.id==='rv'){var ks=Study.due(D).slice(0,20);start(shuf(ks.map(function(k){var c=D.cards[k];return [k,c.z||'',c.p||'']})),'今日复习',{type:'review'})}
  else if(t.id==='ex'||t.id==='back'){home()}
  else if(t.id==='snd'){say(cw()[0]);focus()}
  else if(t.id==='tip'&&R&&!R.lock){R.cur.hint=true;R.reveal=true;R.lock=true;drawWord();setTimeout(function(){if(!R)return;R.reveal=false;R.lock=false;drawWord();focus()},1600)}
  else if(t.id==='again'){start(shuf(RES.list),RES.title,RES.meta)}
  else if(t.id==='again-bad'){start(RES.list.filter(function(x){return RES.bad.indexOf(x[0])>=0}),'打错的词',{type:'wrong'})}
  else if(t.id==='nextch'){startCh(bookOf(RES.meta.book),RES.meta.next)}
  else if(t.id==='clr'){if(confirm('清除英语单词练习的进度、错词本和复习记录？（句子练习、数学星星不受影响）')){D={wrong:{},prog:{},set:S,cards:{},days:{}};save();home()}}
});
fetch('/words/dict.json').then(function(r){return r.json()}).then(function(j){BOOKS=j;home()}).catch(function(){app.innerHTML='<div class="panel">词库加载失败，请刷新重试</div>'});
})();
</script></body></html>
